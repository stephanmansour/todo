<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>To-do</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#FCFCFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1F1E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-do">
<style>
  :root {
    --paper:  #FCFCFB;
    --ink:    #2E3033;
    --muted:  #9C9DA1;
    --rule:   #E9E9E6;
    --stroke: #22436B;
    --shadow: rgba(0,0,0,.12);
    --serif: ui-serif, Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans:  ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:  #1F1F1E;
      --ink:    #DCDCD8;
      --muted:  #7E7F82;
      --rule:   #323231;
      --stroke: #86ABDA;
      --shadow: rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 720px;
    margin: 0 auto;
    padding: 14px 16px;
  }

  /* ---- Kopfzeile ---- */

  .meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px 12px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--rule);
    font-size: 11px;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .tools {
    display: flex;
    gap: 14px;
  }

  .linkbtn {
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    color: var(--muted);
    opacity: .65;
    cursor: pointer;
    transition: opacity 140ms, color 140ms;
  }

  .linkbtn:hover,
  .linkbtn:focus-visible { opacity: 1; color: var(--ink); }

  /* ---- Liste ---- */

  .list {
    flex: 1;
    margin: 0;
    padding: 0;
    list-style: none;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .list::-webkit-scrollbar { width: 8px; }
  .list::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }

  .item {
    display: grid;
    grid-template-columns: 18px 18px 1fr 22px;
    align-items: start;
    gap: 10px;
    padding: 9px 2px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
  }

  .list > .item:last-child { border-bottom: 0; }

  .item.dragging {
    position: relative;
    z-index: 5;
    border-bottom-color: transparent;
    border-radius: 6px;
    box-shadow: 0 6px 20px var(--shadow);
  }

  /* ---- Griff ---- */

  .handle {
    margin-top: 3px;
    padding: 0;
    width: 18px;
    height: 18px;
    display: grid;
    place-items: center;
    border: 0;
    background: none;
    color: var(--muted);
    cursor: grab;
    touch-action: none;
    transition: opacity 140ms;
  }

  .item.dragging .handle { cursor: grabbing; }

  @media (hover: hover) {
    .handle, .del { opacity: 0; }
    .item:hover .handle,
    .item:hover .del,
    .item:focus-within .handle,
    .item:focus-within .del { opacity: 1; }
  }

  /* ---- Kästchen ---- */

  .slot {
    margin-top: 2px;
    padding: 0;
    width: 17px;
    height: 17px;
    display: grid;
    place-items: center;
    border: 1.5px solid var(--muted);
    border-radius: 3px;
    background: none;
    cursor: pointer;
    transition: background 150ms, border-color 150ms;
  }

  .slot:hover { border-color: var(--ink); }

  .item.done .slot {
    background: var(--stroke);
    border-color: var(--stroke);
  }

  .slot .icon svg {
    stroke: var(--paper);
    opacity: 0;
    transform: scale(.6);
    transition: opacity 150ms, transform 150ms;
  }

  .item.done .slot .icon svg { opacity: 1; transform: none; }

  /* ---- Text: die Tinte zieht sich durch ---- */

  .textcell { min-width: 0; }

  .text {
    display: inline;
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink);
    cursor: pointer;
    overflow-wrap: anywhere;
    background-image: linear-gradient(var(--stroke), var(--stroke));
    background-repeat: no-repeat;
    background-size: 0% 1.5px;
    background-position: 0 .58em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    transition: background-size 300ms cubic-bezier(.2,.7,.3,1), color 300ms;
  }

  .item.done .text {
    background-size: 100% 1.5px;
    color: var(--muted);
  }

  .edit {
    width: 100%;
    padding: 0;
    border: 0;
    border-bottom: 1px solid var(--stroke);
    background: transparent;
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink);
    outline: none;
  }

  /* ---- Löschen ---- */

  .del {
    margin-top: 2px;
    padding: 0;
    width: 22px;
    height: 18px;
    display: grid;
    place-items: center;
    border: 0;
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: color 140ms, opacity 140ms;
  }

  .del:hover { color: var(--ink); }

  /* ---- Eingabe ---- */

  .add {
    display: grid;
    grid-template-columns: 18px 18px 1fr 22px;
    align-items: center;
    gap: 10px;
    padding: 11px 2px 2px;
    border-top: 1px solid var(--rule);
  }

  .plus {
    grid-column: 2;
    font-size: 17px;
    line-height: 1;
    text-align: center;
    color: var(--muted);
  }

  .add input {
    width: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink);
    outline: none;
  }

  .add input::placeholder { color: var(--muted); }

  /* ---- Leerer Zustand & Hinweis ---- */

  .empty {
    margin: 0;
    padding: 20px 2px;
    font-family: var(--serif);
    font-size: 14px;
    color: var(--muted);
  }

  .warn {
    margin-bottom: 10px;
    padding: 9px 11px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
  }

  .warn a { color: var(--stroke); }

  /* ---- Fokus & Motion ---- */

  :focus-visible {
    outline: 2px solid var(--stroke);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .sr {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
  <div class="sheet">
    <p id="warn" class="warn" hidden>
      Dieser Browser speichert nichts innerhalb der Notion-Einbettung.
      <a id="warnLink" href="#" target="_blank" rel="noopener">Liste in eigenem Tab öffnen</a>
    </p>

    <div class="meta">
      <span id="count"></span>
      <div class="tools">
        <button type="button" id="exportBtn" class="linkbtn">Sichern</button>
        <button type="button" id="importBtn" class="linkbtn">Laden</button>
        <button type="button" id="clearDone" class="linkbtn" hidden>Erledigte löschen</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>

    <ul id="list" class="list"></ul>

    <p id="empty" class="empty" hidden>Noch leer. Erste Aufgabe unten eintragen.</p>

    <div class="add">
      <span class="plus" aria-hidden="true">+</span>
      <input id="newTask" type="text" placeholder="Aufgabe hinzufügen" autocomplete="off" aria-label="Neue Aufgabe">
    </div>

    <p id="live" class="sr" role="status" aria-live="polite"></p>
  </div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'notion-todo-v1';

  var list      = document.getElementById('list');
  var countEl   = document.getElementById('count');
  var clearBtn  = document.getElementById('clearDone');
  var emptyEl   = document.getElementById('empty');
  var newTask   = document.getElementById('newTask');
  var liveEl    = document.getElementById('live');
  var exportBtn = document.getElementById('exportBtn');
  var importBtn = document.getElementById('importBtn');
  var importFile = document.getElementById('importFile');
  var warnEl    = document.getElementById('warn');
  var warnLink  = document.getElementById('warnLink');

  var ICON_DOTS  = '<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="4" r="1.2"/><circle cx="7.5" cy="4" r="1.2"/><circle cx="2.5" cy="8" r="1.2"/><circle cx="7.5" cy="8" r="1.2"/><circle cx="2.5" cy="12" r="1.2"/><circle cx="7.5" cy="12" r="1.2"/></svg>';
  var ICON_CHECK = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.4 4.7 9 10 3.2"/></svg>';
  var ICON_CROSS = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"/></svg>';

  var tasks = read();
  var drag = null;

  /* ---------- Speichern ---------- */

  function storageWorks() {
    try {
      localStorage.setItem('__probe', '1');
      localStorage.removeItem('__probe');
      return true;
    } catch (err) {
      return false;
    }
  }

  function isTask(t) {
    return t && typeof t.id === 'string' && typeof t.text === 'string' && typeof t.done === 'boolean';
  }

  function read() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed.filter(isTask) : [];
    } catch (err) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (err) {
      showWarning();
    }
  }

  function showWarning() {
    warnLink.href = location.href;
    warnEl.hidden = false;
  }

  function newId() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------- Aufbau ---------- */

  function icon(markup) {
    var span = document.createElement('span');
    span.className = 'icon';
    span.setAttribute('aria-hidden', 'true');
    span.innerHTML = markup;
    return span;
  }

  function buildRow(task) {
    var li = document.createElement('li');
    li.className = task.done ? 'item done' : 'item';
    li.dataset.id = task.id;

    var handle = document.createElement('button');
    handle.type = 'button';
    handle.className = 'handle';
    handle.setAttribute('aria-label', 'Verschieben: ' + task.text);
    handle.appendChild(icon(ICON_DOTS));
    handle.addEventListener('pointerdown', beginDrag);
    handle.addEventListener('keydown', moveByKey);

    var slot = document.createElement('button');
    slot.type = 'button';
    slot.className = 'slot';
    slot.setAttribute('role', 'checkbox');
    slot.setAttribute('aria-checked', String(task.done));
    slot.setAttribute('aria-label', task.text);
    slot.appendChild(icon(ICON_CHECK));
    slot.addEventListener('click', function () { toggle(task.id); });

    var cell = document.createElement('div');
    cell.className = 'textcell';

    var text = document.createElement('span');
    text.className = 'text';
    text.textContent = task.text;
    text.title = 'Doppelklick zum Bearbeiten';
    text.setAttribute('aria-hidden', 'true');
    cell.appendChild(text);

    // Einfacher Klick hakt ab, Doppelklick bearbeitet - kurze Wartezeit trennt beides.
    var clickTimer = null;
    text.addEventListener('click', function () {
      clearTimeout(clickTimer);
      clickTimer = setTimeout(function () { toggle(task.id); }, 190);
    });
    text.addEventListener('dblclick', function () {
      clearTimeout(clickTimer);
      startEdit(li, task);
    });

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.setAttribute('aria-label', 'Löschen: ' + task.text);
    del.appendChild(icon(ICON_CROSS));
    del.addEventListener('click', function () { remove(task.id); });

    li.appendChild(handle);
    li.appendChild(slot);
    li.appendChild(cell);
    li.appendChild(del);
    return li;
  }

  function render() {
    list.replaceChildren.apply(list, tasks.map(buildRow));
    emptyEl.hidden = tasks.length > 0;
    updateMeta();
  }

  function updateMeta() {
    var open = tasks.filter(function (t) { return !t.done; }).length;
    var done = tasks.length - open;

    if (tasks.length === 0) countEl.textContent = '';
    else if (done === 0) countEl.textContent = open + ' offen';
    else countEl.textContent = open + ' offen · ' + done + ' erledigt';

    clearBtn.hidden = done === 0;
  }

  function announce(message) {
    liveEl.textContent = message;
  }

  function rowById(id) {
    return list.querySelector('[data-id="' + id + '"]');
  }

  /* ---------- Aktionen ---------- */

  function add(value) {
    var text = value.trim();
    if (!text) return;
    tasks.push({ id: newId(), text: text, done: false });
    save();
    render();
    list.scrollTop = list.scrollHeight;
  }

  // Nur die betroffene Zeile ändern, damit der Strich sich zeichnen kann.
  function toggle(id) {
    var task = null;
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) { task = tasks[i]; break; }
    }
    if (!task) return;

    task.done = !task.done;
    save();

    var li = rowById(id);
    if (li) {
      li.classList.toggle('done', task.done);
      li.querySelector('.slot').setAttribute('aria-checked', String(task.done));
    }
    updateMeta();
  }

  function remove(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    save();
    render();
    announce('Aufgabe gelöscht.');
  }

  function startEdit(li, task) {
    var cell = li.querySelector('.textcell');
    var input = document.createElement('input');
    var finished = false;

    input.type = 'text';
    input.className = 'edit';
    input.value = task.text;
    input.setAttribute('aria-label', 'Aufgabe bearbeiten');

    function finish(keep) {
      if (finished) return;
      finished = true;
      if (keep) {
        var value = input.value.trim();
        if (value) { task.text = value; save(); }
      }
      render();
    }

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', function () { finish(true); });

    cell.replaceChildren(input);
    input.focus();
    input.select();
  }

  /* ---------- Reihenfolge ---------- */

  // Übernimmt die sichtbare Reihenfolge in die Daten.
  function commitOrder() {
    var position = new Map();
    Array.prototype.forEach.call(list.children, function (li, index) {
      position.set(li.dataset.id, index);
    });
    tasks.sort(function (a, b) { return position.get(a.id) - position.get(b.id); });
    save();
  }

  // Zeile, vor der die gezogene landen soll - null heißt: ans Ende.
  function dropTarget(pointerY, dragged) {
    for (var i = 0; i < list.children.length; i++) {
      var row = list.children[i];
      if (row === dragged) continue;
      var box = row.getBoundingClientRect();
      if (pointerY < box.top + box.height / 2) return row;
    }
    return null;
  }

  function beginDrag(e) {
    if (e.button && e.button !== 0) return;
    e.preventDefault();

    var handle = e.currentTarget;
    handle.setPointerCapture(e.pointerId);

    drag = { handle: handle, li: handle.closest('.item'), startY: e.clientY };
    drag.li.classList.add('dragging');

    handle.addEventListener('pointermove', onDrag);
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
  }

  function onDrag(e) {
    if (!drag) return;

    drag.li.style.transform = 'translateY(' + (e.clientY - drag.startY) + 'px)';

    var target = dropTarget(e.clientY, drag.li);
    if (target === drag.li.nextElementSibling) return;

    // Nach dem Umhängen springt die Zeile im Layout - Startpunkt gleich mitziehen.
    var before = drag.li.getBoundingClientRect().top;
    list.insertBefore(drag.li, target);
    drag.startY += drag.li.getBoundingClientRect().top - before;
    drag.li.style.transform = 'translateY(' + (e.clientY - drag.startY) + 'px)';
  }

  function endDrag(e) {
    if (!drag) return;

    drag.li.style.transform = '';
    drag.li.classList.remove('dragging');
    drag.handle.removeEventListener('pointermove', onDrag);
    drag.handle.removeEventListener('pointerup', endDrag);
    drag.handle.removeEventListener('pointercancel', endDrag);
    if (drag.handle.hasPointerCapture(e.pointerId)) drag.handle.releasePointerCapture(e.pointerId);

    drag = null;
    commitOrder();
  }

  function moveByKey(e) {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();

    var li = e.currentTarget.closest('.item');
    var rows = Array.prototype.slice.call(list.children);
    var from = rows.indexOf(li);
    var to = from + (e.key === 'ArrowUp' ? -1 : 1);
    if (to < 0 || to >= rows.length) return;

    if (e.key === 'ArrowUp') list.insertBefore(li, rows[to]);
    else list.insertBefore(li, rows[to].nextElementSibling);

    commitOrder();
    e.currentTarget.focus();
    announce('Position ' + (to + 1) + ' von ' + rows.length);
  }

  /* ---------- Sichern & Laden ---------- */

  function exportTasks() {
    var blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');

    link.href = url;
    link.download = 'todo-' + new Date().toISOString().slice(0, 10) + '.json';
    link.click();

    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    announce('Liste gesichert.');
  }

  function importTasks(file) {
    var reader = new FileReader();

    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        parsed = null;
      }

      var incoming = Array.isArray(parsed) ? parsed.filter(isTask) : [];
      if (incoming.length === 0) {
        alert('In dieser Datei steht keine gesicherte Liste.');
        return;
      }

      if (tasks.length > 0 &&
          !confirm('Die aktuelle Liste wird durch ' + incoming.length + ' Aufgaben ersetzt. Fortfahren?')) {
        return;
      }

      tasks = incoming;
      save();
      render();
      announce(incoming.length + ' Aufgaben geladen.');
    };

    reader.onerror = function () { alert('Die Datei konnte nicht gelesen werden.'); };
    reader.readAsText(file);
  }

  /* ---------- Start ---------- */

  newTask.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    add(newTask.value);
    newTask.value = '';
  });

  exportBtn.addEventListener('click', exportTasks);

  importBtn.addEventListener('click', function () { importFile.click(); });

  importFile.addEventListener('change', function () {
    var file = importFile.files && importFile.files[0];
    if (file) importTasks(file);
    importFile.value = '';
  });

  clearBtn.addEventListener('click', function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save();
    render();
    announce('Erledigte Aufgaben entfernt.');
  });

  if (!storageWorks()) showWarning();
  render();

  // Im eigenen App-Fenster gleich tippbereit sein.
  if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
    newTask.focus();
  }

  // Macht die App offline lauffähig. Über file:// gibt es das nicht.
  var secure = location.protocol === 'https:' || location.hostname === 'localhost';
  if ('serviceWorker' in navigator && secure) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
