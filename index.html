<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>To-do</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#FCFCFB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1F1E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-do">
<style>
  :root {
    --paper:  #FCFCFB;
    --ink:    #2E3033;
    --muted:  #9C9DA1;
    --rule:   #E9E9E6;
    --stroke: #22436B;
    --shadow: rgba(0,0,0,.12);
    --tint:   rgba(34,67,107,.05);

    --q1: #22436B;
    --q2: #4A7397;
    --q3: #7E96AC;
    --q4: #A6ABB1;

    --serif: ui-serif, Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans:  ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:  #1F1F1E;
      --ink:    #DCDCD8;
      --muted:  #7E7F82;
      --rule:   #323231;
      --stroke: #86ABDA;
      --shadow: rgba(0,0,0,.5);
      --tint:   rgba(134,171,218,.07);

      --q1: #8FB6E6;
      --q2: #7BA0C6;
      --q3: #6E8AA6;
      --q4: #7C8188;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 1000px;
    margin: 0 auto;
    padding: 14px 18px 16px;
  }

  /* ---- Kopfzeile ---- */

  .meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px 12px;
    padding-bottom: 10px;
    font-size: 11px;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .tools { display: flex; gap: 14px; }

  .linkbtn {
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    color: var(--muted);
    opacity: .65;
    cursor: pointer;
    transition: opacity 140ms, color 140ms;
  }

  .linkbtn:hover,
  .linkbtn:focus-visible { opacity: 1; color: var(--ink); }

  /* ---- Matrix ---- */

  .matrix {
    position: relative;
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 18px 30px;
  }

  /* Senkrechte Achse zwischen den Spalten - die waagerechte zeichnen
     bereits die farbigen Oberkanten der unteren beiden Felder. */
  .matrix::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    background: var(--rule);
    pointer-events: none;
  }

  .pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    --accent: var(--stroke);
    border-top: 2px solid var(--accent);
    padding-top: 8px;
    transition: background 160ms;
  }

  .pane.over { background: var(--tint); }

  .pane[data-key="q1"] { --accent: var(--q1); }
  .pane[data-key="q2"] { --accent: var(--q2); }
  .pane[data-key="q3"] { --accent: var(--q3); }
  .pane[data-key="q4"] { --accent: var(--q4); }

  .pane header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 0 2px 7px;
  }

  .pane h2 {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .tally {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  .hint {
    margin-left: auto;
    font-size: 10px;
    letter-spacing: .04em;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---- Liste ---- */

  .list {
    flex: 1;
    min-height: 44px;
    margin: 0;
    padding: 0;
    list-style: none;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .list::-webkit-scrollbar { width: 7px; }
  .list::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }

  .item {
    display: grid;
    grid-template-columns: 16px 17px 1fr 20px;
    align-items: start;
    gap: 8px;
    padding: 7px 2px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
  }

  .list > .item:last-child { border-bottom: 0; }

  .item.dragging {
    position: relative;
    z-index: 5;
    border-bottom-color: transparent;
    border-radius: 6px;
    box-shadow: 0 6px 20px var(--shadow);
  }

  /* ---- Griff ---- */

  .handle {
    margin-top: 3px;
    padding: 0;
    width: 16px;
    height: 17px;
    display: grid;
    place-items: center;
    border: 0;
    background: none;
    color: var(--muted);
    cursor: grab;
    touch-action: none;
    transition: opacity 140ms;
  }

  .item.dragging .handle { cursor: grabbing; }

  @media (hover: hover) {
    .handle, .del { opacity: 0; }
    .item:hover .handle,
    .item:hover .del,
    .item:focus-within .handle,
    .item:focus-within .del { opacity: 1; }
  }

  /* ---- Kästchen ---- */

  .slot {
    margin-top: 2px;
    padding: 0;
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
    border: 1.5px solid var(--muted);
    border-radius: 3px;
    background: none;
    cursor: pointer;
    transition: background 150ms, border-color 150ms;
  }

  .slot:hover { border-color: var(--accent); }

  .item.done .slot {
    background: var(--accent);
    border-color: var(--accent);
  }

  .slot .icon svg {
    stroke: var(--paper);
    opacity: 0;
    transform: scale(.6);
    transition: opacity 150ms, transform 150ms;
  }

  .item.done .slot .icon svg { opacity: 1; transform: none; }

  /* ---- Text: die Tinte zieht sich durch ---- */

  .textcell { min-width: 0; }

  .text {
    display: inline;
    font-family: var(--serif);
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink);
    cursor: pointer;
    overflow-wrap: anywhere;
    background-image: linear-gradient(var(--accent), var(--accent));
    background-repeat: no-repeat;
    background-size: 0% 1.5px;
    background-position: 0 .58em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    transition: background-size 300ms cubic-bezier(.2,.7,.3,1), color 300ms;
  }

  .item.done .text {
    background-size: 100% 1.5px;
    color: var(--muted);
  }

  .edit {
    width: 100%;
    padding: 0;
    border: 0;
    border-bottom: 1px solid var(--accent);
    background: transparent;
    font-family: var(--serif);
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink);
    outline: none;
  }

  /* ---- Löschen ---- */

  .del {
    margin-top: 2px;
    padding: 0;
    width: 20px;
    height: 17px;
    display: grid;
    place-items: center;
    border: 0;
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: color 140ms, opacity 140ms;
  }

  .del:hover { color: var(--ink); }

  /* ---- Eingabe ---- */

  .add {
    display: grid;
    grid-template-columns: 16px 17px 1fr;
    align-items: center;
    gap: 8px;
    padding: 9px 2px 0;
    border-top: 1px solid var(--rule);
  }

  .plus {
    grid-column: 2;
    font-size: 16px;
    line-height: 1;
    text-align: center;
    color: var(--muted);
  }

  .add input {
    width: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    font-family: var(--serif);
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink);
    outline: none;
  }

  .add input::placeholder { color: var(--muted); }

  /* ---- Hinweis ---- */

  .warn {
    margin-bottom: 10px;
    padding: 9px 11px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
  }

  .warn a { color: var(--stroke); }

  /* ---- Fokus & Motion ---- */

  :focus-visible {
    outline: 2px solid var(--stroke);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .sr {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; }
  }

  /* ---- Schmale Fenster: vier Blöcke untereinander ---- */

  @media (max-width: 700px) {
    html, body { overflow: auto; }

    .sheet {
      height: auto;
      min-height: 100vh;
      padding: 12px 14px 24px;
    }

    .matrix {
      grid-template-columns: 1fr;
      grid-template-rows: none;
      gap: 22px;
    }

    .matrix::before { display: none; }

    .list { overflow: visible; }
    .hint { font-size: 10px; }
  }
</style>
</head>
<body>
  <div class="sheet">
    <p id="warn" class="warn" hidden>
      Dieser Browser speichert hier nichts - das passiert in eingebetteten Ansichten.
      <a id="warnLink" href="#" target="_blank" rel="noopener">Liste in eigenem Tab öffnen</a>
    </p>

    <div class="meta">
      <span id="count"></span>
      <div class="tools">
        <button type="button" id="exportBtn" class="linkbtn">Sichern</button>
        <button type="button" id="importBtn" class="linkbtn">Laden</button>
        <button type="button" id="clearDone" class="linkbtn" hidden>Erledigte löschen</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>

    <div id="matrix" class="matrix"></div>

    <p id="live" class="sr" role="status" aria-live="polite"></p>
  </div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'notion-todo-v1';

  /* Die vier Felder. Aus "dringend" und "wichtig" ergibt sich das Feld -
     deshalb wandert eine Aufgabe von selbst dorthin, wo sie hingehört. */
  var PANES = [
    { key: 'q1', urgent: true,  important: true,
      name: 'Sofort',    hint: 'dringend · wichtig' },
    { key: 'q2', urgent: false, important: true,
      name: 'Einplanen', hint: 'wichtig · kann warten' },
    { key: 'q3', urgent: true,  important: false,
      name: 'Abgeben',   hint: 'dringend · nicht wichtig' },
    { key: 'q4', urgent: false, important: false,
      name: 'Streichen', hint: 'weder noch' }
  ];

  var matrixEl  = document.getElementById('matrix');
  var countEl   = document.getElementById('count');
  var clearBtn  = document.getElementById('clearDone');
  var liveEl    = document.getElementById('live');
  var warnEl    = document.getElementById('warn');
  var warnLink  = document.getElementById('warnLink');
  var exportBtn = document.getElementById('exportBtn');
  var importBtn = document.getElementById('importBtn');
  var importFile = document.getElementById('importFile');

  var ICON_DOTS  = '<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="4" r="1.2"/><circle cx="7.5" cy="4" r="1.2"/><circle cx="2.5" cy="8" r="1.2"/><circle cx="7.5" cy="8" r="1.2"/><circle cx="2.5" cy="12" r="1.2"/><circle cx="7.5" cy="12" r="1.2"/></svg>';
  var ICON_CHECK = '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.4 4.7 9 10 3.2"/></svg>';
  var ICON_CROSS = '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"/></svg>';

  var tasks = read();
  var drag = null;

  /* ---------- Speichern ---------- */

  function storageWorks() {
    try {
      localStorage.setItem('__probe', '1');
      localStorage.removeItem('__probe');
      return true;
    } catch (err) {
      return false;
    }
  }

  function isTask(t) {
    return t && typeof t.id === 'string' && typeof t.text === 'string' && typeof t.done === 'boolean';
  }

  // Ältere Sicherungen kennen die beiden Merkmale noch nicht: ab nach "Einplanen".
  function normalize(t) {
    return {
      id: t.id,
      text: t.text,
      done: t.done,
      urgent: t.urgent === true,
      important: t.important !== false
    };
  }

  function read() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed.filter(isTask).map(normalize) : [];
    } catch (err) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (err) {
      showWarning();
    }
  }

  function showWarning() {
    warnLink.href = location.href;
    warnEl.hidden = false;
  }

  function newId() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------- Felder ---------- */

  function paneOf(task) {
    for (var i = 0; i < PANES.length; i++) {
      if (PANES[i].urgent === task.urgent && PANES[i].important === task.important) return PANES[i];
    }
    return PANES[1];
  }

  function paneOfElement(li) {
    var section = li.closest('.pane');
    for (var i = 0; i < PANES.length; i++) {
      if (PANES[i].el === section) return PANES[i];
    }
    return null;
  }

  function buildMatrix() {
    PANES.forEach(function (pane) {
      var section = document.createElement('section');
      section.className = 'pane';
      section.dataset.key = pane.key;

      var head = document.createElement('header');

      var title = document.createElement('h2');
      title.id = 'head-' + pane.key;
      title.textContent = pane.name;

      var tally = document.createElement('span');
      tally.className = 'tally';

      var hint = document.createElement('span');
      hint.className = 'hint';
      hint.textContent = pane.hint;

      head.appendChild(title);
      head.appendChild(tally);
      head.appendChild(hint);

      var list = document.createElement('ul');
      list.className = 'list';
      list.setAttribute('aria-labelledby', title.id);

      var addRow = document.createElement('div');
      addRow.className = 'add';

      var plus = document.createElement('span');
      plus.className = 'plus';
      plus.setAttribute('aria-hidden', 'true');
      plus.textContent = '+';

      var input = document.createElement('input');
      input.type = 'text';
      input.autocomplete = 'off';
      input.placeholder = 'Aufgabe hinzufügen';
      input.setAttribute('aria-label', 'Neue Aufgabe unter ' + pane.name);
      input.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        add(input.value, pane);
        input.value = '';
      });

      addRow.appendChild(plus);
      addRow.appendChild(input);

      section.appendChild(head);
      section.appendChild(list);
      section.appendChild(addRow);
      matrixEl.appendChild(section);

      pane.el = section;
      pane.listEl = list;
      pane.tallyEl = tally;
      pane.inputEl = input;
    });
  }

  /* ---------- Aufbau einer Zeile ---------- */

  function icon(markup) {
    var span = document.createElement('span');
    span.className = 'icon';
    span.setAttribute('aria-hidden', 'true');
    span.innerHTML = markup;
    return span;
  }

  function buildRow(task) {
    var li = document.createElement('li');
    li.className = task.done ? 'item done' : 'item';
    li.dataset.id = task.id;

    var handle = document.createElement('button');
    handle.type = 'button';
    handle.className = 'handle';
    handle.setAttribute('aria-label', 'Verschieben: ' + task.text);
    handle.title = 'Ziehen, oder mit den Pfeiltasten verschieben';
    handle.appendChild(icon(ICON_DOTS));
    handle.addEventListener('pointerdown', beginDrag);
    handle.addEventListener('keydown', moveByKey);

    var slot = document.createElement('button');
    slot.type = 'button';
    slot.className = 'slot';
    slot.setAttribute('role', 'checkbox');
    slot.setAttribute('aria-checked', String(task.done));
    slot.setAttribute('aria-label', task.text);
    slot.appendChild(icon(ICON_CHECK));
    slot.addEventListener('click', function () { toggle(task.id); });

    var cell = document.createElement('div');
    cell.className = 'textcell';

    var text = document.createElement('span');
    text.className = 'text';
    text.textContent = task.text;
    text.title = 'Doppelklick zum Bearbeiten';
    text.setAttribute('aria-hidden', 'true');
    cell.appendChild(text);

    // Einfacher Klick hakt ab, Doppelklick bearbeitet - kurze Wartezeit trennt beides.
    var clickTimer = null;
    text.addEventListener('click', function () {
      clearTimeout(clickTimer);
      clickTimer = setTimeout(function () { toggle(task.id); }, 190);
    });
    text.addEventListener('dblclick', function () {
      clearTimeout(clickTimer);
      startEdit(li, task);
    });

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.setAttribute('aria-label', 'Löschen: ' + task.text);
    del.appendChild(icon(ICON_CROSS));
    del.addEventListener('click', function () { remove(task.id); });

    li.appendChild(handle);
    li.appendChild(slot);
    li.appendChild(cell);
    li.appendChild(del);
    return li;
  }

  function render() {
    var rows = {};
    PANES.forEach(function (pane) { rows[pane.key] = []; });

    tasks.forEach(function (task) {
      rows[paneOf(task).key].push(buildRow(task));
    });

    PANES.forEach(function (pane) {
      pane.listEl.replaceChildren.apply(pane.listEl, rows[pane.key]);
    });

    updateMeta();
  }

  function updateMeta() {
    var open = 0, done = 0;
    var perPane = {};
    PANES.forEach(function (pane) { perPane[pane.key] = 0; });

    tasks.forEach(function (task) {
      if (task.done) done++; else open++;
      if (!task.done) perPane[paneOf(task).key]++;
    });

    PANES.forEach(function (pane) {
      pane.tallyEl.textContent = perPane[pane.key] > 0 ? String(perPane[pane.key]) : '';
    });

    if (tasks.length === 0) countEl.textContent = '';
    else if (done === 0) countEl.textContent = open + ' offen';
    else countEl.textContent = open + ' offen · ' + done + ' erledigt';

    clearBtn.hidden = done === 0;
  }

  function announce(message) {
    liveEl.textContent = message;
  }

  function rowById(id) {
    return matrixEl.querySelector('[data-id="' + id + '"]');
  }

  /* ---------- Aktionen ---------- */

  function add(value, pane) {
    var text = value.trim();
    if (!text) return;

    tasks.push({
      id: newId(),
      text: text,
      done: false,
      urgent: pane.urgent,
      important: pane.important
    });

    save();
    render();
    pane.listEl.scrollTop = pane.listEl.scrollHeight;
  }

  // Nur die betroffene Zeile ändern, damit der Strich sich zeichnen kann.
  function toggle(id) {
    var task = null;
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) { task = tasks[i]; break; }
    }
    if (!task) return;

    task.done = !task.done;
    save();

    var li = rowById(id);
    if (li) {
      li.classList.toggle('done', task.done);
      li.querySelector('.slot').setAttribute('aria-checked', String(task.done));
    }
    updateMeta();
  }

  function remove(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    save();
    render();
    announce('Aufgabe gelöscht.');
  }

  function startEdit(li, task) {
    var cell = li.querySelector('.textcell');
    var input = document.createElement('input');
    var finished = false;

    input.type = 'text';
    input.className = 'edit';
    input.value = task.text;
    input.setAttribute('aria-label', 'Aufgabe bearbeiten');

    function finish(keep) {
      if (finished) return;
      finished = true;
      if (keep) {
        var value = input.value.trim();
        if (value) { task.text = value; save(); }
      }
      render();
    }

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', function () { finish(true); });

    cell.replaceChildren(input);
    input.focus();
    input.select();
  }

  /* ---------- Reihenfolge und Zuordnung ---------- */

  // Übernimmt die sichtbare Anordnung in die Daten: Feld bestimmt die Merkmale.
  function commitOrder() {
    var byId = {};
    tasks.forEach(function (task) { byId[task.id] = task; });

    var next = [];
    PANES.forEach(function (pane) {
      Array.prototype.forEach.call(pane.listEl.children, function (li) {
        var task = byId[li.dataset.id];
        if (!task) return;
        task.urgent = pane.urgent;
        task.important = pane.important;
        next.push(task);
      });
    });

    tasks = next;
    save();
    updateMeta();
  }

  // Zeile, vor der die gezogene landen soll - null heißt: ans Ende.
  function dropTarget(list, pointerY, dragged) {
    for (var i = 0; i < list.children.length; i++) {
      var row = list.children[i];
      if (row === dragged) continue;
      var box = row.getBoundingClientRect();
      if (pointerY < box.top + box.height / 2) return row;
    }
    return null;
  }

  function paneUnder(x, y) {
    for (var i = 0; i < PANES.length; i++) {
      var box = PANES[i].el.getBoundingClientRect();
      if (x >= box.left && x <= box.right && y >= box.top && y <= box.bottom) return PANES[i];
    }
    return null;
  }

  function highlight(pane) {
    PANES.forEach(function (p) { p.el.classList.toggle('over', p === pane); });
  }

  function follow(e) {
    drag.li.style.transform =
      'translate(' + (e.clientX - drag.startX) + 'px,' + (e.clientY - drag.startY) + 'px)';
  }

  function beginDrag(e) {
    if (e.button && e.button !== 0) return;
    e.preventDefault();

    var handle = e.currentTarget;
    handle.setPointerCapture(e.pointerId);

    drag = { handle: handle, li: handle.closest('.item'), startX: e.clientX, startY: e.clientY };
    drag.li.classList.add('dragging');

    handle.addEventListener('pointermove', onDrag);
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
  }

  function onDrag(e) {
    if (!drag) return;

    follow(e);

    var pane = paneUnder(e.clientX, e.clientY) || paneOfElement(drag.li);
    if (!pane) return;
    highlight(pane);

    // Lange Listen mitziehen, wenn der Zeiger an den Rand kommt.
    var listBox = pane.listEl.getBoundingClientRect();
    if (e.clientY < listBox.top + 24) pane.listEl.scrollTop -= 12;
    else if (e.clientY > listBox.bottom - 24) pane.listEl.scrollTop += 12;

    var target = dropTarget(pane.listEl, e.clientY, drag.li);
    if (drag.li.parentNode === pane.listEl && target === drag.li.nextElementSibling) return;

    // Nach dem Umhängen springt die Zeile im Layout - Startpunkt gleich mitziehen.
    var before = drag.li.getBoundingClientRect();
    pane.listEl.insertBefore(drag.li, target);
    var after = drag.li.getBoundingClientRect();

    drag.startX += after.left - before.left;
    drag.startY += after.top - before.top;
    follow(e);
  }

  function endDrag(e) {
    if (!drag) return;

    drag.li.style.transform = '';
    drag.li.classList.remove('dragging');
    drag.handle.removeEventListener('pointermove', onDrag);
    drag.handle.removeEventListener('pointerup', endDrag);
    drag.handle.removeEventListener('pointercancel', endDrag);
    if (drag.handle.hasPointerCapture(e.pointerId)) drag.handle.releasePointerCapture(e.pointerId);

    highlight(null);
    drag = null;
    commitOrder();
  }

  /* Tastatur: hoch/runter sortiert im Feld und springt an dessen Rand ins
     Nachbarfeld, links/rechts wechselt die Spalte. */
  var NEIGHBOUR = {
    q1: { up: null, down: 'q3', left: null, right: 'q2' },
    q2: { up: null, down: 'q4', left: 'q1', right: null },
    q3: { up: 'q1', down: null, left: null, right: 'q4' },
    q4: { up: 'q2', down: null, left: 'q3', right: null }
  };

  function paneByKey(key) {
    for (var i = 0; i < PANES.length; i++) {
      if (PANES[i].key === key) return PANES[i];
    }
    return null;
  }

  function moveByKey(e) {
    var direction = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key];
    if (!direction) return;
    e.preventDefault();

    var handle = e.currentTarget;
    var li = handle.closest('.item');
    var pane = paneOfElement(li);
    if (!pane) return;

    var rows = Array.prototype.slice.call(pane.listEl.children);
    var index = rows.indexOf(li);
    var vertical = direction === 'up' || direction === 'down';
    var step = direction === 'up' ? -1 : 1;

    if (vertical && index + step >= 0 && index + step < rows.length) {
      // Innerhalb des Feldes umsortieren.
      var mate = rows[index + step];
      pane.listEl.insertBefore(li, step < 0 ? mate : mate.nextElementSibling);
      announce('Position ' + (index + step + 1) + ' von ' + rows.length + ' in ' + pane.name);
    } else {
      var target = paneByKey(NEIGHBOUR[pane.key][direction]);
      if (!target) return;

      // Am Rand ins Nachbarfeld: von oben kommend nach ganz oben, sonst ans Ende.
      if (direction === 'down') target.listEl.insertBefore(li, target.listEl.firstChild);
      else target.listEl.appendChild(li);

      announce('Verschoben nach ' + target.name);
    }

    commitOrder();
    handle.focus();
    li.scrollIntoView({ block: 'nearest' });
  }

  /* ---------- Sichern & Laden ---------- */

  function exportTasks() {
    var blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');

    link.href = url;
    link.download = 'todo-' + new Date().toISOString().slice(0, 10) + '.json';
    link.click();

    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    announce('Liste gesichert.');
  }

  function importTasks(file) {
    var reader = new FileReader();

    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        parsed = null;
      }

      var incoming = Array.isArray(parsed) ? parsed.filter(isTask).map(normalize) : [];
      if (incoming.length === 0) {
        alert('In dieser Datei steht keine gesicherte Liste.');
        return;
      }

      if (tasks.length > 0 &&
          !confirm('Die aktuelle Liste wird durch ' + incoming.length + ' Aufgaben ersetzt. Fortfahren?')) {
        return;
      }

      tasks = incoming;
      save();
      render();
      announce(incoming.length + ' Aufgaben geladen.');
    };

    reader.onerror = function () { alert('Die Datei konnte nicht gelesen werden.'); };
    reader.readAsText(file);
  }

  /* ---------- Start ---------- */

  exportBtn.addEventListener('click', exportTasks);

  importBtn.addEventListener('click', function () { importFile.click(); });

  importFile.addEventListener('change', function () {
    var file = importFile.files && importFile.files[0];
    if (file) importTasks(file);
    importFile.value = '';
  });

  clearBtn.addEventListener('click', function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save();
    render();
    announce('Erledigte Aufgaben entfernt.');
  });

  if (!storageWorks()) showWarning();
  buildMatrix();
  render();

  // Im eigenen App-Fenster gleich tippbereit sein.
  if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
    PANES[0].inputEl.focus();
  }

  // Macht die App offline lauffähig. Über file:// gibt es das nicht.
  var secure = location.protocol === 'https:' || location.hostname === 'localhost';
  if ('serviceWorker' in navigator && secure) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
