<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>To-do</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-do">
<style>
  html { font-size: calc(100% * var(--scale, 1)); }

  :root {
    --scale:   1;
    --bg:      #F6F7F9;
    --card:    #FFFFFF;
    --text:    #16181D;
    --muted:   #8A8F98;
    --line:    #E7E9ED;
    --field:   #F1F3F6;
    --shadow:  0 1px 2px rgba(16,24,40,.04), 0 2px 8px rgba(16,24,40,.05);
    --lift:    0 12px 32px rgba(16,24,40,.18);

    --c-quick:    #16A34A;
    --c-vital:    #E11D48;
    --c-later:    #D97706;
    --c-delegate: #64748B;
    --c-done:     #8A8F98;

    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:     #0E1014;
      --card:   #171A20;
      --text:   #E6E8EC;
      --muted:  #868C97;
      --line:   #262A32;
      --field:  #1E222A;
      --shadow: 0 0 0 1px rgba(255,255,255,.045);
      --lift:   0 12px 36px rgba(0,0,0,.62);

      --c-quick:    #3DD68C;
      --c-vital:    #FB7185;
      --c-later:    #FBBF24;
      --c-delegate: #94A3B8;
      --c-done:     #868C97;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 0.9375rem;
    -webkit-font-smoothing: antialiased;
  }

  body.dragging { user-select: none; cursor: grabbing; }

  .app {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 18px 3.5rem;
  }

  /* ---- Kopfzeile ---- */

  .topbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.375rem 0.875rem;
    padding: 1.375rem 0.125rem 0.875rem;
  }

  .brand {
    font-size: 1.1875rem;
    font-weight: 680;
    letter-spacing: -.02em;
  }

  .tally {
    margin-left: 0.5rem;
    font-size: 0.8125rem;
    font-weight: 450;
    color: var(--muted);
  }

  .tools { display: flex; gap: 1rem; }

  .linkbtn {
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    font-size: 0.8125rem;
    color: var(--muted);
    cursor: pointer;
    transition: color 140ms;
  }

  .linkbtn:hover, .linkbtn:focus-visible { color: var(--text); }

  /* Der Größenregler bemisst sich bewusst in px - er soll stehen bleiben,
     während sich alles andere unter ihm verkleinert. */
  .zoom {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
  }

  .zoom .aa { font-weight: 600; line-height: 1; }
  .zoom .aa.s { font-size: 10px; }
  .zoom .aa.l { font-size: 15px; }

  #zoom {
    -webkit-appearance: none;
    appearance: none;
    width: 76px;
    height: 16px;
    margin: 0;
    background: none;
    cursor: ew-resize;
  }

  #zoom::-webkit-slider-runnable-track {
    height: 2px;
    border-radius: 2px;
    background: var(--line);
  }

  #zoom::-moz-range-track {
    height: 2px;
    border-radius: 2px;
    background: var(--line);
  }

  #zoom::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px; height: 12px;
    margin-top: -5px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 140ms;
  }

  #zoom::-moz-range-thumb {
    width: 12px; height: 12px;
    border: 0;
    border-radius: 50%;
    background: var(--muted);
    transition: background 140ms;
  }

  #zoom:hover::-webkit-slider-thumb { background: var(--text); }
  #zoom:hover::-moz-range-thumb { background: var(--text); }

  /* ---- Eingabe ---- */

  .composer {
    position: sticky;
    top: 0;
    z-index: 4;
    padding: 0.5rem 0 0.875rem;
    background: var(--bg);
  }

  .composer::after {
    content: '';
    display: block;
    height: 0.875rem;
    margin: 0 0 -0.875rem;
    background: linear-gradient(var(--bg), transparent);
  }

  #newTask {
    width: 100%;
    padding: 0.9375rem 1.0625rem;
    border: 1px solid var(--line);
    border-radius: 0.875rem;
    background: var(--card);
    box-shadow: var(--shadow);
    font: inherit;
    font-size: 0.9688rem;
    color: var(--text);
    caret-color: var(--pick, var(--text));
    outline: none;
    transition: border-color 150ms, box-shadow 150ms;
  }

  #newTask::placeholder { color: var(--muted); }

  #newTask:focus {
    border-color: var(--pick, var(--line));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--pick, var(--text)) 14%, transparent);
  }

  .picker {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4375rem;
    margin-top: 0.5625rem;
  }

  .picker[hidden] { display: none; }

  .pill { cursor: pointer; }

  .pill input {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .pill span {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.375rem 0.75rem;
    border: 1px solid var(--line);
    border-radius: 62.4375rem;
    background: var(--card);
    font-size: 0.7812rem;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
    transition: background 150ms, color 150ms, border-color 150ms;
  }

  .pill span[data-n] { padding-left: 0.5625rem; }

  .pill span[data-n]::before {
    content: attr(data-n);
    display: grid;
    place-items: center;
    width: 1.0625rem; height: 1.0625rem;
    border-radius: 0.375rem;
    background: color-mix(in srgb, var(--c) 16%, transparent);
    color: var(--c);
    font-size: 0.6562rem;
    font-weight: 700;
  }

  .pill:hover span { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }

  .pill input:checked + span {
    border-color: transparent;
    background: color-mix(in srgb, var(--c) 13%, var(--card));
    color: var(--c);
  }

  .pill input:checked + span[data-n]::before { background: var(--c); color: var(--card); }

  .pill input:focus-visible + span { outline: 2px solid var(--c); outline-offset: 2px; }

  .daypicker { margin-top: 0.4375rem; }
  .daypicker .pill span { padding: 0.3125rem 0.6875rem; font-size: 0.75rem; }

  /* ---- Spalten ---- */

  #sections {
    display: grid;
    grid-template-columns: 1fr;
    align-items: start;
    gap: 0 0.875rem;
  }

  .column { min-width: 0; }

  .viewtoggle {
    display: inline-grid;
    place-items: center;
    color: var(--muted);
  }

  .viewtoggle svg { width: 0.875rem; height: 0.75rem; }

  .viewtoggle[aria-pressed="true"] { color: var(--text); }

  /* Drei Spalten lohnen sich erst ab dieser Fensterbreite. Darunter bleibt
     die Ansicht einspaltig und der Schalter wird gar nicht erst angeboten. */
  @media (min-width: 1040px) {
    body.wide .app { max-width: 1360px; }
    body.wide #sections { grid-template-columns: repeat(3, 1fr); }
    body.wide #newTask,
    body.wide .picker { max-width: 42rem; }
  }

  @media (max-width: 1039px) {
    .viewtoggle { display: none; }
  }

  /* ---- Abschnitte ---- */

  .section {
    margin-bottom: 0.875rem;
    padding: 0.25rem 0.375rem 0.375rem;
    border-radius: 1rem;
    background: var(--card);
    box-shadow: var(--shadow);
    transition: background 160ms;
  }

  .section[hidden] { display: none; }

  .section.dropping { background: color-mix(in srgb, var(--c) 8%, var(--card)); }

  .section > header {
    display: flex;
    align-items: center;
    gap: 0.5625rem;
    padding: 0.75rem 0.625rem 0.625rem;
  }

  .badge {
    display: grid;
    place-items: center;
    width: 1.3125rem; height: 1.3125rem;
    border-radius: 0.4375rem;
    background: var(--c);
    color: var(--card);
    font-size: 0.7188rem;
    font-weight: 700;
  }

  .badge svg { stroke: var(--card); }

  .section h2 {
    margin: 0;
    font-size: 0.7188rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--c);
  }

  .section h2 .qualifier {
    font-weight: 500;
    letter-spacing: .02em;
    text-transform: none;
    color: var(--muted);
  }

  .count {
    margin-left: auto;
    min-width: 1.375rem;
    padding: 0.125rem 0.4375rem;
    border-radius: 62.4375rem;
    background: color-mix(in srgb, var(--c) 12%, transparent);
    font-size: 0.7188rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-align: center;
    color: var(--c);
  }

  .count[hidden] { display: none; }

  .wipe {
    margin-left: 0.625rem;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    font-size: 0.7188rem;
    color: var(--muted);
    cursor: pointer;
    transition: color 140ms;
  }

  .wipe:hover { color: var(--c-vital); }

  .empty {
    margin: 0;
    padding: 0.125rem 0.625rem 0.75rem;
    font-size: 0.8438rem;
    color: var(--muted);
  }

  .empty[hidden] { display: none; }

  /* ---- Wochentage in Abschnitt 3 ---- */

  .day { border-radius: 0.625rem; transition: background 160ms; }

  .day.dropping { background: color-mix(in srgb, var(--c) 9%, transparent); }

  .day + .day { margin-top: 0.125rem; }

  .day > header {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    padding: 0.5rem 0.625rem 0.25rem;
  }

  .day .weekday {
    font-size: 0.6562rem;
    font-weight: 700;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .day .rule {
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .day .tick {
    font-size: 0.6875rem;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  .day .tick[hidden] { display: none; }

  /* ---- Aufgaben ---- */

  .list { margin: 0; padding: 0; list-style: none; min-height: 0.5rem; }

  .item {
    display: grid;
    grid-template-columns: 1.25rem 1.25rem 1fr 1.5rem;
    align-items: start;
    gap: 0.625rem;
    padding: 0.5625rem 0.625rem;
    border-radius: 0.625rem;
    background: transparent;
    transition: background 140ms;
  }

  .item.plain { grid-template-columns: 1.25rem 1fr 1.5rem; }

  .item:hover { background: var(--field); }

  .item.lifted {
    background: var(--card);
    box-shadow: var(--lift);
  }

  .handle {
    margin-top: 0.125rem;
    padding: 0;
    width: 1.25rem; height: 1.25rem;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 0.375rem;
    background: none;
    color: var(--muted);
    cursor: grab;
    touch-action: none;
    transition: opacity 140ms;
  }

  @media (hover: hover) {
    .handle, .del { opacity: 0; }
    .item:hover .handle,
    .item:hover .del,
    .item:focus-within .handle,
    .item:focus-within .del { opacity: 1; }
  }

  .slot {
    margin-top: 1px;
    padding: 0;
    width: 1.1875rem; height: 1.1875rem;
    display: grid;
    place-items: center;
    border: 1.6px solid color-mix(in srgb, var(--c) 42%, transparent);
    border-radius: 0.4375rem;
    background: none;
    cursor: pointer;
    transition: background 160ms, border-color 160ms;
  }

  .slot:hover { border-color: var(--c); }

  .item.done .slot { background: var(--c); border-color: var(--c); }

  .slot .icon svg {
    stroke: var(--card);
    opacity: 0;
    transform: scale(.55);
    transition: opacity 160ms, transform 160ms;
  }

  .item.done .slot .icon svg { opacity: 1; transform: none; }

  .textcell { min-width: 0; padding-top: 1px; }

  .text {
    display: inline;
    font-size: 0.9062rem;
    line-height: 1.5;
    color: var(--text);
    cursor: pointer;
    overflow-wrap: anywhere;
    background-image: linear-gradient(var(--c), var(--c));
    background-repeat: no-repeat;
    background-size: 0% 1.5px;
    background-position: 0 .62em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    transition: background-size 320ms cubic-bezier(.2,.7,.3,1), color 320ms;
  }

  .item.done .text { background-size: 100% 1.5px; color: var(--muted); }

  .edit {
    width: 100%;
    padding: 0;
    border: 0;
    border-bottom: 1.5px solid var(--c);
    background: transparent;
    font: inherit;
    font-size: 0.9062rem;
    line-height: 1.5;
    color: var(--text);
    outline: none;
  }

  .del {
    margin-top: 0.125rem;
    padding: 0;
    width: 1.5rem; height: 1.25rem;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 0.375rem;
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: color 140ms, opacity 140ms;
  }

  .del:hover { color: var(--c-vital); }

  /* Platzhalter, der die Lücke hält, während eine Zeile gezogen wird. */
  .ghost {
    border-radius: 0.625rem;
    background: var(--field);
  }

  /* ---- Notizen ---- */

  .notes {
    margin-top: 1.375rem;
    padding: 0.25rem 0.375rem 0.625rem;
    border-radius: 1rem;
    background: var(--card);
    box-shadow: var(--shadow);
  }

  .notes header {
    display: flex;
    align-items: baseline;
    gap: 0.5625rem;
    padding: 0.75rem 0.75rem 0.375rem;
  }

  .notes h2 {
    margin: 0;
    font-size: 0.7188rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .saved {
    margin-left: auto;
    font-size: 0.6875rem;
    color: var(--muted);
    opacity: 0;
    transition: opacity 400ms;
  }

  .saved.show { opacity: 1; }

  #notes {
    display: block;
    width: 100%;
    min-height: 6rem;
    padding: 0.25rem 0.75rem 0.5rem;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 0.9062rem;
    line-height: 1.6;
    color: var(--text);
    resize: none;
    outline: none;
    overflow: hidden;
  }

  #notes::placeholder { color: var(--muted); }

  /* ---- Hinweis, Fokus, Bewegung ---- */

  .warn {
    margin: 0.875rem 0 0;
    padding: 0.6875rem 0.8125rem;
    border-radius: 0.75rem;
    background: var(--card);
    box-shadow: var(--shadow);
    font-size: 0.8125rem;
    line-height: 1.5;
    color: var(--muted);
  }

  .warn a { color: var(--c-delegate); }

  :focus-visible { outline: 2px solid var(--c, var(--text)); outline-offset: 2px; }

  .sr {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; }
  }

  @media (max-width: 460px) {
    .app { padding: 0 13px 3rem; }
    .pill span { padding: 0.375rem 0.625rem; font-size: 0.75rem; }
    .pill span[data-n] { padding-left: 0.5rem; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div><span class="brand">To-do</span><span id="count" class="tally"></span></div>
      <div class="tools">
        <button type="button" id="viewToggle" class="linkbtn viewtoggle" aria-pressed="false">
          <svg viewBox="0 0 14 12" fill="currentColor" aria-hidden="true"><rect x="0" y="0" width="3.2" height="12" rx="1"/><rect x="5.4" y="0" width="3.2" height="12" rx="1"/><rect x="10.8" y="0" width="3.2" height="12" rx="1"/></svg>
        </button>
        <button type="button" id="exportBtn" class="linkbtn">Sichern</button>
        <button type="button" id="importBtn" class="linkbtn">Laden</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <div class="zoom">
          <span class="aa s" aria-hidden="true">A</span>
          <input type="range" id="zoom" min="0.6" max="1.2" step="0.05" value="1" aria-label="Ansichtsgröße">
          <span class="aa l" aria-hidden="true">A</span>
        </div>
      </div>
    </div>

    <p id="warn" class="warn" hidden>
      Dieser Browser speichert hier nichts - das passiert in eingebetteten Ansichten.
      <a id="warnLink" href="#" target="_blank" rel="noopener">In eigenem Tab öffnen</a>
    </p>

    <div class="composer">
      <input id="newTask" type="text" autocomplete="off" placeholder="Was steht an?" aria-label="Neue Aufgabe">
      <div id="catPicker" class="picker" role="radiogroup" aria-label="Kategorie"></div>
      <div id="dayPicker" class="picker daypicker" role="radiogroup" aria-label="Wochentag" hidden></div>
    </div>

    <main id="sections"></main>

    <section class="notes" id="notesSection">
      <header>
        <h2>Notizen</h2>
        <span id="saved" class="saved">gespeichert</span>
      </header>
      <textarea id="notes" placeholder="Freier Platz. Gedanken, Nummern, alles, was in keine Aufgabe passt."></textarea>
    </section>

    <p id="live" class="sr" role="status" aria-live="polite"></p>
  </div>

<script>
(function () {
  'use strict';

  var TASK_KEY  = 'notion-todo-v1';
  var NOTE_KEY  = 'notion-todo-notes-v1';
  var SCALE_KEY = 'notion-todo-scale-v1';
  var VIEW_KEY  = 'notion-todo-view-v1';

  // So lange darf der Durchstreich-Strich laufen, bevor die Zeile umzieht.
  var MOVE_DELAY = 340;

  var CATS = [
    { key: 'quick',    n: 1, name: 'Schnell erledigt', qualifier: 'bitte jetzt',
      pick: 'Jetzt',      color: 'var(--c-quick)',    column: 0 },
    { key: 'vital',    n: 2, name: 'Wirklich wichtig', qualifier: '',
      pick: 'Wichtig',    color: 'var(--c-vital)',    column: 0 },
    { key: 'later',    n: 3, name: 'Kann noch warten', qualifier: '',
      pick: 'Später',     color: 'var(--c-later)',    column: 1 },
    { key: 'delegate', n: 4, name: 'Delegier das',     qualifier: 'nicht so wichtig',
      pick: 'Delegieren', color: 'var(--c-delegate)', column: 2 }
  ];

  var DAYS = [
    { key: 'mo', name: 'Montag',     pick: 'Mo' },
    { key: 'di', name: 'Dienstag',   pick: 'Di' },
    { key: 'mi', name: 'Mittwoch',   pick: 'Mi' },
    { key: 'do', name: 'Donnerstag', pick: 'Do' },
    { key: 'fr', name: 'Freitag',    pick: 'Fr' }
  ];

  // Ablagefächer für offene Aufgaben, in Bildschirmreihenfolge.
  // Erledigtes hat einen eigenen Bereich und ist bewusst kein Ziel.
  var BINS = [];

  var sectionsEl = document.getElementById('sections');
  var catPicker  = document.getElementById('catPicker');
  var dayPicker  = document.getElementById('dayPicker');
  var newTask    = document.getElementById('newTask');
  var countEl    = document.getElementById('count');
  var liveEl     = document.getElementById('live');
  var warnEl     = document.getElementById('warn');
  var warnLink   = document.getElementById('warnLink');
  var exportBtn  = document.getElementById('exportBtn');
  var importBtn  = document.getElementById('importBtn');
  var importFile = document.getElementById('importFile');
  var notesEl    = document.getElementById('notes');
  var savedEl    = document.getElementById('saved');
  var zoomEl     = document.getElementById('zoom');
  var viewToggle = document.getElementById('viewToggle');
  var notesSection = document.getElementById('notesSection');

  var ICON_GRIP  = '<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="4" r="1.15"/><circle cx="7.5" cy="4" r="1.15"/><circle cx="2.5" cy="8" r="1.15"/><circle cx="7.5" cy="8" r="1.15"/><circle cx="2.5" cy="12" r="1.15"/><circle cx="7.5" cy="12" r="1.15"/></svg>';
  var ICON_CHECK = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.4 4.7 9 10 3.2"/></svg>';
  var ICON_CROSS = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"/></svg>';

  var MOTION_OK = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var COLUMNS = [];
  var doneSection, doneList, doneCount;
  var tasks = readTasks();
  var drag = null;
  var noteTimer = null;
  var moveTimer = null;
  var scaleTimer = null;

  /* ---------- Daten ---------- */

  function byKey(list, key) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].key === key) return list[i];
    }
    return null;
  }

  function isTask(t) {
    return t && typeof t.id === 'string' && typeof t.text === 'string' && typeof t.done === 'boolean';
  }

  /* Bringt gespeicherte Aufgaben auf die aktuelle Form. Aus der Eisenhower-
     Fassung übersetzt: wichtig+dringend wird 2, wichtig allein wird 3,
     der Rest wird 4. Wer in 3 landet und keinen Tag hat, bekommt Montag. */
  function normalize(t) {
    var cat = byKey(CATS, t.cat) ? t.cat : null;

    if (!cat && typeof t.important === 'boolean') {
      if (t.important) cat = t.urgent ? 'vital' : 'later';
      else cat = 'delegate';
    }

    cat = cat || 'later';

    return {
      id: t.id,
      text: t.text,
      done: t.done,
      cat: cat,
      day: cat === 'later' ? (byKey(DAYS, t.day) ? t.day : 'mo') : null,
      doneAt: t.done ? (typeof t.doneAt === 'number' ? t.doneAt : 0) : null
    };
  }

  function readTasks() {
    try {
      var raw = localStorage.getItem(TASK_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed.filter(isTask).map(normalize) : [];
    } catch (err) {
      return [];
    }
  }

  function storageWorks() {
    try {
      localStorage.setItem('__probe', '1');
      localStorage.removeItem('__probe');
      return true;
    } catch (err) {
      return false;
    }
  }

  function save() {
    try {
      localStorage.setItem(TASK_KEY, JSON.stringify(tasks));
    } catch (err) {
      showWarning();
    }
  }

  function saveNotes() {
    try {
      localStorage.setItem(NOTE_KEY, notesEl.value);
      savedEl.classList.add('show');
      setTimeout(function () { savedEl.classList.remove('show'); }, 1500);
    } catch (err) {
      showWarning();
    }
  }

  function showWarning() {
    warnLink.href = location.href;
    warnEl.hidden = false;
  }

  function newId() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------- Gerüst ---------- */

  function icon(markup) {
    var span = document.createElement('span');
    span.className = 'icon';
    span.setAttribute('aria-hidden', 'true');
    span.innerHTML = markup;
    return span;
  }

  function pill(group, entry, checked, color, numbered, onPick) {
    var label = document.createElement('label');
    label.className = 'pill';
    label.style.setProperty('--c', color);

    var input = document.createElement('input');
    input.type = 'radio';
    input.name = group;
    input.value = entry.key;
    input.checked = checked;

    var face = document.createElement('span');
    if (numbered) face.dataset.n = String(entry.n);
    face.appendChild(document.createTextNode(entry.pick));

    input.addEventListener('change', function () { onPick(entry); });

    label.appendChild(input);
    label.appendChild(face);

    entry.inputEl = input;
    return label;
  }

  // Am Wochenende ist Montag der nächste sinnvolle Vorschlag.
  function todayKey() {
    var index = new Date().getDay() - 1;
    return index >= 0 && index <= 4 ? DAYS[index].key : 'mo';
  }

  function buildPickers() {
    CATS.forEach(function (cat, index) {
      catPicker.appendChild(pill('cat', cat, index === 0, cat.color, true, pickCat));
    });

    DAYS.forEach(function (day) {
      dayPicker.appendChild(pill('day', day, day.key === todayKey(), 'var(--c-later)', false, pickDay));
    });

    newTask.style.setProperty('--pick', CATS[0].color);
  }

  function header(cat) {
    var head = document.createElement('header');

    var badge = document.createElement('span');
    badge.className = 'badge';
    badge.setAttribute('aria-hidden', 'true');
    if (cat) badge.textContent = String(cat.n);
    else badge.appendChild(icon(ICON_CHECK));

    var title = document.createElement('h2');
    title.id = 'head-' + (cat ? cat.key : 'done');
    title.textContent = cat ? cat.name : 'Erledigt';

    if (cat && cat.qualifier) {
      var qualifier = document.createElement('span');
      qualifier.className = 'qualifier';
      qualifier.textContent = ', ' + cat.qualifier;
      title.appendChild(qualifier);
    }

    var count = document.createElement('span');
    count.className = 'count';
    count.hidden = true;

    head.appendChild(badge);
    head.appendChild(title);
    head.appendChild(count);

    return { el: head, titleId: title.id, countEl: count };
  }

  /* Drei feste Spalten. In der schmalen Ansicht stehen sie untereinander,
     wodurch sich von selbst wieder die gewohnte Reihenfolge 1-2-3-4 ergibt. */
  function buildColumns() {
    for (var i = 0; i < 3; i++) {
      var column = document.createElement('div');
      column.className = 'column';
      sectionsEl.appendChild(column);
      COLUMNS.push(column);
    }
  }

  function buildSections() {
    CATS.forEach(function (cat) {
      var section = document.createElement('section');
      section.className = 'section';
      section.style.setProperty('--c', cat.color);

      var head = header(cat);
      section.appendChild(head.el);

      if (cat.key === 'later') {
        DAYS.forEach(function (day) { section.appendChild(buildDay(cat, day)); });
      } else {
        section.appendChild(makeList(cat, null, section, head.titleId));

        var empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'Noch nichts hier.';
        section.appendChild(empty);
        cat.emptyEl = empty;
      }

      COLUMNS[cat.column].appendChild(section);
      cat.countEl = head.countEl;
    });

    buildDoneSection();
    COLUMNS[2].appendChild(notesSection);
  }

  function buildDay(cat, day) {
    var wrap = document.createElement('div');
    wrap.className = 'day';

    var head = document.createElement('header');

    var weekday = document.createElement('span');
    weekday.className = 'weekday';
    weekday.id = 'day-' + day.key;
    weekday.textContent = day.pick;

    var rule = document.createElement('span');
    rule.className = 'rule';

    var tick = document.createElement('span');
    tick.className = 'tick';
    tick.hidden = true;

    head.appendChild(weekday);
    head.appendChild(rule);
    head.appendChild(tick);

    wrap.appendChild(head);
    wrap.appendChild(makeList(cat, day, wrap, weekday.id));

    day.tickEl = tick;
    return wrap;
  }

  /* Der Ablagebereich ist das ganze Element - so bleibt zwischen Überschrift
     und erster Zeile keine tote Zone, in der das Ziehen ins Leere greift. */
  function makeList(cat, day, zoneEl, labelledBy) {
    var list = document.createElement('ul');
    list.className = 'list';
    list.setAttribute('aria-labelledby', labelledBy);

    BINS.push({ cat: cat, day: day, zoneEl: zoneEl, listEl: list });
    return list;
  }

  function buildDoneSection() {
    doneSection = document.createElement('section');
    doneSection.className = 'section';
    doneSection.style.setProperty('--c', 'var(--c-done)');
    doneSection.hidden = true;

    var head = header(null);

    var wipe = document.createElement('button');
    wipe.type = 'button';
    wipe.className = 'wipe';
    wipe.textContent = 'Löschen';
    wipe.addEventListener('click', clearDone);
    head.el.appendChild(wipe);

    doneList = document.createElement('ul');
    doneList.className = 'list';
    doneList.setAttribute('aria-labelledby', head.titleId);

    doneSection.appendChild(head.el);
    doneSection.appendChild(doneList);
    COLUMNS[2].appendChild(doneSection);

    doneCount = head.countEl;
  }

  function binOfList(list) {
    for (var i = 0; i < BINS.length; i++) {
      if (BINS[i].listEl === list) return BINS[i];
    }
    return null;
  }

  /* ---------- Zeile ---------- */

  function buildRow(task) {
    var li = document.createElement('li');
    li.className = task.done ? 'item plain done' : 'item';
    li.dataset.id = task.id;

    // Erledigtes wird nicht sortiert, deshalb dort auch kein Griff.
    if (!task.done) {
      var handle = document.createElement('button');
      handle.type = 'button';
      handle.className = 'handle';
      handle.setAttribute('aria-label', 'Verschieben: ' + task.text);
      handle.title = 'Ziehen, oder mit Pfeil hoch/runter verschieben';
      handle.appendChild(icon(ICON_GRIP));
      handle.addEventListener('pointerdown', beginDrag);
      handle.addEventListener('keydown', moveByKey);
      li.appendChild(handle);
    }

    var slot = document.createElement('button');
    slot.type = 'button';
    slot.className = 'slot';
    slot.setAttribute('role', 'checkbox');
    slot.setAttribute('aria-checked', String(task.done));
    slot.setAttribute('aria-label', task.text);
    slot.appendChild(icon(ICON_CHECK));
    slot.addEventListener('click', function () { toggle(task.id); });

    var cell = document.createElement('div');
    cell.className = 'textcell';

    var text = document.createElement('span');
    text.className = 'text';
    text.textContent = task.text;
    text.title = 'Doppelklick zum Bearbeiten';
    text.setAttribute('aria-hidden', 'true');
    cell.appendChild(text);

    // Einfacher Klick hakt ab, Doppelklick bearbeitet - kurze Wartezeit trennt beides.
    var clickTimer = null;
    text.addEventListener('click', function () {
      clearTimeout(clickTimer);
      clickTimer = setTimeout(function () { toggle(task.id); }, 190);
    });
    text.addEventListener('dblclick', function () {
      clearTimeout(clickTimer);
      startEdit(li, task);
    });

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.setAttribute('aria-label', 'Löschen: ' + task.text);
    del.appendChild(icon(ICON_CROSS));
    del.addEventListener('click', function () { remove(task.id); });

    li.appendChild(slot);
    li.appendChild(cell);
    li.appendChild(del);
    return li;
  }

  function binFor(task) {
    for (var i = 0; i < BINS.length; i++) {
      var bin = BINS[i];
      if (bin.cat.key !== task.cat) continue;
      if (bin.day && bin.day.key !== task.day) continue;
      return bin;
    }
    return BINS[0];
  }

  function render() {
    var buckets = BINS.map(function () { return []; });
    var finished = [];

    tasks.forEach(function (task) {
      if (task.done) finished.push(task);
      else buckets[BINS.indexOf(binFor(task))].push(buildRow(task));
    });

    // Zuletzt Abgehaktes steht oben.
    finished.sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0); });

    BINS.forEach(function (bin, index) {
      bin.listEl.replaceChildren.apply(bin.listEl, buckets[index]);
    });

    doneList.replaceChildren.apply(doneList, finished.map(buildRow));

    updateMeta();
  }

  function updateMeta() {
    var open = 0, done = 0;
    var perCat = {}, perDay = {};

    CATS.forEach(function (cat) { perCat[cat.key] = 0; });
    DAYS.forEach(function (day) { perDay[day.key] = 0; });

    tasks.forEach(function (task) {
      if (task.done) { done++; return; }
      open++;
      perCat[task.cat]++;
      if (task.day) perDay[task.day]++;
    });

    CATS.forEach(function (cat) {
      cat.countEl.hidden = perCat[cat.key] === 0;
      cat.countEl.textContent = String(perCat[cat.key]);
      if (cat.emptyEl) cat.emptyEl.hidden = perCat[cat.key] > 0;
    });

    DAYS.forEach(function (day) {
      day.tickEl.hidden = perDay[day.key] === 0;
      day.tickEl.textContent = String(perDay[day.key]);
    });

    doneSection.hidden = done === 0;
    doneCount.hidden = done === 0;
    doneCount.textContent = String(done);

    if (tasks.length === 0) countEl.textContent = '';
    else if (done === 0) countEl.textContent = open + ' offen';
    else countEl.textContent = open + ' offen · ' + done + ' erledigt';
  }

  function announce(message) { liveEl.textContent = message; }

  function taskById(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) return tasks[i];
    }
    return null;
  }

  /* ---------- Aktionen ---------- */

  function pickCat(cat) {
    dayPicker.hidden = cat.key !== 'later';
    newTask.style.setProperty('--pick', cat.color);
    announce(cat.name + ' gewählt.');
  }

  function pickDay(day) { announce(day.name + ' gewählt.'); }

  function selected(list) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].inputEl.checked) return list[i];
    }
    return list[0];
  }

  function add(value) {
    var text = value.trim();
    if (!text) return;

    var cat = selected(CATS);
    var day = cat.key === 'later' ? selected(DAYS) : null;

    tasks.push({
      id: newId(),
      text: text,
      done: false,
      cat: cat.key,
      day: day ? day.key : null,
      doneAt: null
    });

    save();
    render();
    announce('Hinzugefügt: ' + cat.name + (day ? ', ' + day.name : ''));
  }

  /* Erst den Strich zeichnen lassen, dann umziehen. Die Kategorie bleibt
     gespeichert, damit die Aufgabe beim Enthaken dorthin zurückfindet. */
  function toggle(id) {
    var task = taskById(id);
    if (!task) return;

    task.done = !task.done;
    task.doneAt = task.done ? Date.now() : null;
    save();

    var li = sectionsEl.querySelector('[data-id="' + id + '"]');
    if (li) {
      li.classList.toggle('done', task.done);
      li.querySelector('.slot').setAttribute('aria-checked', String(task.done));
    }

    announce(task.done ? 'Erledigt: ' + task.text : 'Zurück in die Liste: ' + task.text);
    scheduleReflow();
  }

  function scheduleReflow() {
    clearTimeout(moveTimer);
    moveTimer = setTimeout(function () {
      if (drag) { scheduleReflow(); return; }

      // Wer per Tastatur abgehakt hat, soll nach dem Umzug nicht ins Leere fassen.
      var here = document.activeElement;
      var row = here && here.closest ? here.closest('.item') : null;
      var keep = row && here.classList.contains('slot') ? row.dataset.id : null;

      render();

      if (keep) {
        var again = sectionsEl.querySelector('[data-id="' + keep + '"] .slot');
        if (again) again.focus();
      }
    }, MOVE_DELAY);
  }

  function remove(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    save();
    render();
    announce('Aufgabe gelöscht.');
  }

  function clearDone() {
    tasks = tasks.filter(function (t) { return !t.done; });
    save();
    render();
    announce('Erledigte Aufgaben entfernt.');
  }

  function startEdit(li, task) {
    var cell = li.querySelector('.textcell');
    var input = document.createElement('input');
    var finished = false;

    input.type = 'text';
    input.className = 'edit';
    input.value = task.text;
    input.setAttribute('aria-label', 'Aufgabe bearbeiten');

    function finish(keep) {
      if (finished) return;
      finished = true;
      if (keep) {
        var value = input.value.trim();
        if (value) { task.text = value; save(); }
      }
      render();
    }

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', function () { finish(true); });

    cell.replaceChildren(input);
    input.focus();
    input.select();
  }

  // Übernimmt die sichtbare Anordnung: Fach bestimmt Kategorie und Tag.
  function commitOrder() {
    var index = {};
    tasks.forEach(function (task) { index[task.id] = task; });

    var next = [];
    BINS.forEach(function (bin) {
      Array.prototype.forEach.call(bin.listEl.children, function (node) {
        var task = index[node.dataset.id];
        if (!task) return;
        task.cat = bin.cat.key;
        task.day = bin.day ? bin.day.key : null;
        next.push(task);
        delete index[task.id];
      });
    });

    // Erledigtes steht nicht in den Fächern und behält seinen Platz.
    tasks.forEach(function (task) {
      if (index[task.id]) next.push(task);
    });

    tasks = next;
    save();
    updateMeta();
  }

  /* ---------- Ziehen ----------
     Die gezogene Zeile wird aus dem Textfluss genommen (position: fixed) und
     ein Platzhalter hält ihre Lücke. Dadurch verschiebt sich beim Ziehen nichts
     mehr unter dem Zeiger, und das Verhaken zwischen zwei Zeilen entfällt. */

  function rowsInPlay() {
    return Array.prototype.slice.call(sectionsEl.querySelectorAll('.item'));
  }

  // Bewegt den Platzhalter und lässt die verdrängten Zeilen weich nachrücken.
  function placeGhost(list, before) {
    if (drag.ghost.parentNode === list && drag.ghost.nextElementSibling === before) return;

    var rows = MOTION_OK ? rowsInPlay() : [];

    // Erst die sichtbare Lage merken, dann laufende Bewegungen abräumen -
    // sonst fließen sie in die nächste Messung ein und die Zeilen driften.
    var from = rows.map(function (row) { return row.getBoundingClientRect().top; });

    rows.forEach(function (row) {
      row.style.transition = 'none';
      row.style.transform = '';
    });

    list.insertBefore(drag.ghost, before);

    var to = rows.map(function (row) { return row.getBoundingClientRect().top; });

    rows.forEach(function (row, i) {
      if (from[i] === to[i]) return;
      row.style.transform = 'translateY(' + (from[i] - to[i]) + 'px)';

      requestAnimationFrame(function () {
        row.style.transition = 'transform 170ms cubic-bezier(.2,.7,.3,1)';
        row.style.transform = '';
      });
    });
  }

  function clearShifts() {
    rowsInPlay().forEach(function (row) {
      row.style.transition = '';
      row.style.transform = '';
    });
  }

  // Das Fach unter dem Zeiger - oder, wenn keins passt, das nächstgelegene.
  // Waagerecht und senkrecht gemessen, damit es auch neben- statt
  // untereinander liegende Spalten richtig trifft.
  function binAt(x, y) {
    var nearest = null, best = Infinity;

    for (var i = 0; i < BINS.length; i++) {
      var box = BINS[i].zoneEl.getBoundingClientRect();
      var dx = x < box.left ? box.left - x : (x > box.right ? x - box.right : 0);
      var dy = y < box.top ? box.top - y : (y > box.bottom ? y - box.bottom : 0);

      if (!dx && !dy) return BINS[i];

      var distance = dx * dx + dy * dy;
      if (distance < best) { best = distance; nearest = BINS[i]; }
    }

    return nearest;
  }

  function referenceRow(list, y) {
    for (var i = 0; i < list.children.length; i++) {
      var row = list.children[i];
      if (row === drag.ghost) continue;
      var box = row.getBoundingClientRect();
      if (y < box.top + box.height / 2) return row;
    }
    return null;
  }

  function updateTarget() {
    var bin = binAt(drag.x, drag.y);
    if (!bin) return;

    if (drag.bin !== bin) {
      if (drag.bin) drag.bin.zoneEl.classList.remove('dropping');
      bin.zoneEl.classList.add('dropping');
      drag.li.style.setProperty('--c', bin.cat.color);
      drag.bin = bin;
    }

    placeGhost(bin.listEl, referenceRow(bin.listEl, drag.y));
  }

  function autoScroll() {
    if (!drag) return;

    var edge = 80;
    var speed = 0;

    if (drag.y < edge) speed = -Math.ceil((edge - drag.y) / 6);
    else if (drag.y > window.innerHeight - edge) speed = Math.ceil((drag.y - (window.innerHeight - edge)) / 6);

    if (speed) {
      window.scrollBy(0, speed);
      updateTarget();
    }

    drag.raf = requestAnimationFrame(autoScroll);
  }

  function beginDrag(e) {
    if (e.button && e.button !== 0) return;
    if (drag) return;
    e.preventDefault();

    var handle = e.currentTarget;
    var li = handle.closest('.item');
    var box = li.getBoundingClientRect();
    var origin = binOfList(li.parentNode);

    var ghost = document.createElement('li');
    ghost.className = 'ghost';
    ghost.style.height = box.height + 'px';

    drag = {
      handle: handle,
      li: li,
      ghost: ghost,
      bin: null,
      originX: e.clientX,
      originY: e.clientY,
      x: e.clientX,
      y: e.clientY,
      raf: 0,
      landing: false
    };

    li.parentNode.insertBefore(ghost, li);

    li.style.setProperty('--c', origin ? origin.cat.color : CATS[0].color);
    li.style.position = 'fixed';
    li.style.left = box.left + 'px';
    li.style.top = box.top + 'px';
    li.style.width = box.width + 'px';
    li.style.margin = '0';
    li.style.pointerEvents = 'none';
    li.style.zIndex = '60';
    li.classList.add('lifted');
    document.body.appendChild(li);
    document.body.classList.add('dragging');

    handle.setPointerCapture(e.pointerId);
    handle.addEventListener('pointermove', onDrag);
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);

    updateTarget();
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function onDrag(e) {
    if (!drag || drag.landing) return;

    drag.x = e.clientX;
    drag.y = e.clientY;
    drag.li.style.transform =
      'translate(' + (drag.x - drag.originX) + 'px,' + (drag.y - drag.originY) + 'px)';

    updateTarget();
  }

  function endDrag(e) {
    if (!drag || drag.landing) return;

    drag.landing = true;
    cancelAnimationFrame(drag.raf);

    drag.handle.removeEventListener('pointermove', onDrag);
    drag.handle.removeEventListener('pointerup', endDrag);
    drag.handle.removeEventListener('pointercancel', endDrag);
    if (drag.handle.hasPointerCapture(e.pointerId)) drag.handle.releasePointerCapture(e.pointerId);

    var target = drag.ghost.getBoundingClientRect();
    var current = drag.li.getBoundingClientRect();

    if (!MOTION_OK || (Math.abs(target.top - current.top) < 1 && Math.abs(target.left - current.left) < 1)) {
      settle();
      return;
    }

    // Zum Schluss rutscht die Zeile sichtbar in ihre Lücke.
    drag.li.style.transition = 'transform 160ms cubic-bezier(.2,.7,.3,1)';
    drag.li.style.transform =
      'translate(' + (target.left - current.left + (drag.x - drag.originX)) + 'px,' +
                     (target.top - current.top + (drag.y - drag.originY)) + 'px)';

    setTimeout(settle, 170);
  }

  function settle() {
    if (!drag) return;

    var li = drag.li;
    var ghost = drag.ghost;

    li.removeAttribute('style');
    li.classList.remove('lifted');
    ghost.parentNode.insertBefore(li, ghost);
    ghost.remove();

    if (drag.bin) drag.bin.zoneEl.classList.remove('dropping');
    document.body.classList.remove('dragging');

    var landedIn = drag.bin;
    drag = null;

    clearShifts();
    commitOrder();

    if (landedIn) {
      announce(landedIn.cat.name + (landedIn.day ? ', ' + landedIn.day.name : ''));
    }
  }

  /* Tastatur: hoch/runter sortiert im Fach und springt an dessen Rand ins
     nächste - damit ist jede Kategorie und jeder Tag ohne Maus erreichbar. */
  function moveByKey(e) {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();

    var handle = e.currentTarget;
    var li = handle.closest('.item');
    var list = li.parentNode;
    var bin = binOfList(list);
    if (!bin) return;

    var rows = Array.prototype.slice.call(list.children);
    var index = rows.indexOf(li);
    var step = e.key === 'ArrowUp' ? -1 : 1;
    var next = index + step;

    if (next >= 0 && next < rows.length) {
      var mate = rows[next];
      list.insertBefore(li, step < 0 ? mate : mate.nextElementSibling);
      announce('Position ' + (next + 1) + ' von ' + rows.length);
    } else {
      var neighbour = BINS[BINS.indexOf(bin) + step];
      if (!neighbour) return;

      if (step > 0) neighbour.listEl.insertBefore(li, neighbour.listEl.firstChild);
      else neighbour.listEl.appendChild(li);

      announce(neighbour.cat.name + (neighbour.day ? ', ' + neighbour.day.name : ''));
    }

    commitOrder();
    handle.focus();
    li.scrollIntoView({ block: 'nearest' });
  }

  /* ---------- Ansichtsgröße ----------
     Alle Maße im Stylesheet hängen an der Wurzel-Schriftgröße. Ein Wert
     genügt deshalb, um Schrift, Abstände und Kästchen gemeinsam zu ändern. */

  function applyScale(value) {
    var scale = Math.min(1.2, Math.max(0.6, value || 1));

    document.documentElement.style.setProperty('--scale', String(scale));
    zoomEl.value = String(scale);
    zoomEl.setAttribute('aria-valuetext', Math.round(scale * 100) + ' Prozent');

    return scale;
  }

  function loadScale() {
    var stored;
    try {
      stored = parseFloat(localStorage.getItem(SCALE_KEY));
    } catch (err) {
      stored = NaN;
    }
    applyScale(isNaN(stored) ? 1 : stored);
  }

  /* ---------- Ansicht ---------- */

  function applyView(wide) {
    document.body.classList.toggle('wide', wide);
    viewToggle.setAttribute('aria-pressed', String(wide));
    viewToggle.setAttribute('aria-label', wide ? 'Schmale Ansicht' : 'Breite Ansicht, drei Spalten');
    viewToggle.title = wide ? 'Schmale Ansicht' : 'Breite Ansicht, drei Spalten';
    return wide;
  }

  function loadView() {
    var stored;
    try {
      stored = localStorage.getItem(VIEW_KEY);
    } catch (err) {
      stored = null;
    }
    applyView(stored === 'wide');
  }

  /* ---------- Notizen ---------- */

  function growNotes() {
    notesEl.style.height = 'auto';
    notesEl.style.height = notesEl.scrollHeight + 'px';
  }

  function loadNotes() {
    try {
      notesEl.value = localStorage.getItem(NOTE_KEY) || '';
    } catch (err) {
      notesEl.value = '';
    }
    growNotes();
  }

  /* ---------- Sichern & Laden ---------- */

  function exportAll() {
    var payload = { version: 4, tasks: tasks, notes: notesEl.value };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');

    link.href = url;
    link.download = 'todo-' + new Date().toISOString().slice(0, 10) + '.json';
    link.click();

    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    announce('Liste gesichert.');
  }

  function importAll(file) {
    var reader = new FileReader();

    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        parsed = null;
      }

      // Ältere Sicherungen sind eine reine Liste, neuere ein Paket mit Notizen.
      var rawTasks = Array.isArray(parsed) ? parsed
        : (parsed && Array.isArray(parsed.tasks) ? parsed.tasks : []);
      var incoming = rawTasks.filter(isTask).map(normalize);
      var incomingNotes = parsed && typeof parsed.notes === 'string' ? parsed.notes : null;

      if (incoming.length === 0 && incomingNotes === null) {
        alert('In dieser Datei steht keine gesicherte Liste.');
        return;
      }

      if ((tasks.length > 0 || notesEl.value.trim() !== '') &&
          !confirm('Aufgaben und Notizen werden durch den Inhalt der Datei ersetzt. Fortfahren?')) {
        return;
      }

      tasks = incoming;
      save();
      render();

      if (incomingNotes !== null) {
        notesEl.value = incomingNotes;
        growNotes();
        saveNotes();
      }

      announce(incoming.length + ' Aufgaben geladen.');
    };

    reader.onerror = function () { alert('Die Datei konnte nicht gelesen werden.'); };
    reader.readAsText(file);
  }

  /* ---------- Start ---------- */

  newTask.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    add(newTask.value);
    newTask.value = '';
  });

  // Alt + 1 bis 4 wählt die Kategorie. e.code, damit die Belegung egal ist.
  document.addEventListener('keydown', function (e) {
    if (!e.altKey && !e.metaKey && !e.ctrlKey) return;
    var index = ['Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(e.code);
    if (index === -1) return;

    e.preventDefault();
    CATS[index].inputEl.checked = true;
    pickCat(CATS[index]);
    newTask.focus();
  });

  viewToggle.addEventListener('click', function () {
    var wide = applyView(viewToggle.getAttribute('aria-pressed') !== 'true');
    growNotes();

    try {
      localStorage.setItem(VIEW_KEY, wide ? 'wide' : 'narrow');
    } catch (err) {
      showWarning();
    }
  });

  zoomEl.addEventListener('input', function () {
    var scale = applyScale(parseFloat(zoomEl.value));
    growNotes();

    clearTimeout(scaleTimer);
    scaleTimer = setTimeout(function () {
      try {
        localStorage.setItem(SCALE_KEY, String(scale));
      } catch (err) {
        showWarning();
      }
    }, 250);
  });

  notesEl.addEventListener('input', function () {
    growNotes();
    clearTimeout(noteTimer);
    noteTimer = setTimeout(saveNotes, 500);
  });

  exportBtn.addEventListener('click', exportAll);
  importBtn.addEventListener('click', function () { importFile.click(); });

  importFile.addEventListener('change', function () {
    var file = importFile.files && importFile.files[0];
    if (file) importAll(file);
    importFile.value = '';
  });

  window.addEventListener('resize', growNotes);

  loadScale();
  loadView();

  if (!storageWorks()) showWarning();
  buildPickers();
  buildColumns();
  buildSections();
  render();
  loadNotes();

  if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
    newTask.focus();
  }

  var secure = location.protocol === 'https:' || location.hostname === 'localhost';
  if ('serviceWorker' in navigator && secure) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
