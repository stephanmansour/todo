<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>To-do</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-do">
<style>
  :root {
    --bg:      #F6F7F9;
    --card:    #FFFFFF;
    --text:    #16181D;
    --muted:   #8A8F98;
    --line:    #E7E9ED;
    --field:   #F1F3F6;
    --shadow:  0 1px 2px rgba(16,24,40,.04), 0 2px 8px rgba(16,24,40,.05);
    --lift:    0 8px 28px rgba(16,24,40,.16);

    --c-quick:    #16A34A;
    --c-vital:    #E11D48;
    --c-later:    #D97706;
    --c-delegate: #64748B;

    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:     #0E1014;
      --card:   #171A20;
      --text:   #E6E8EC;
      --muted:  #868C97;
      --line:   #262A32;
      --field:  #1E222A;
      --shadow: 0 0 0 1px rgba(255,255,255,.045);
      --lift:   0 10px 34px rgba(0,0,0,.6);

      --c-quick:    #3DD68C;
      --c-vital:    #FB7185;
      --c-later:    #FBBF24;
      --c-delegate: #94A3B8;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 18px 56px;
  }

  /* ---- Kopfzeile ---- */

  .topbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px 14px;
    padding: 22px 2px 14px;
  }

  .brand {
    font-size: 19px;
    font-weight: 680;
    letter-spacing: -.02em;
  }

  .tally {
    margin-left: 8px;
    font-size: 13px;
    font-weight: 450;
    color: var(--muted);
  }

  .tools { display: flex; gap: 16px; }

  .linkbtn {
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: color 140ms;
  }

  .linkbtn:hover, .linkbtn:focus-visible { color: var(--text); }

  /* ---- Eingabe ---- */

  .composer {
    position: sticky;
    top: 0;
    z-index: 4;
    padding: 8px 0 14px;
    background: var(--bg);
  }

  .composer::after {
    content: '';
    display: block;
    height: 14px;
    margin: 0 0 -14px;
    background: linear-gradient(var(--bg), transparent);
  }

  #newTask {
    width: 100%;
    padding: 15px 17px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    box-shadow: var(--shadow);
    font: inherit;
    font-size: 15.5px;
    color: var(--text);
    caret-color: var(--pick, var(--text));
    outline: none;
    transition: border-color 150ms, box-shadow 150ms;
  }

  #newTask::placeholder { color: var(--muted); }

  #newTask:focus {
    border-color: var(--pick, var(--line));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--pick, var(--text)) 14%, transparent);
  }

  .picker {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 9px;
  }

  .pill { cursor: pointer; }

  .pill input {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .pill span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px 6px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
    transition: background 150ms, color 150ms, border-color 150ms;
  }

  .pill span::before {
    content: attr(data-n);
    display: grid;
    place-items: center;
    width: 17px; height: 17px;
    border-radius: 6px;
    background: color-mix(in srgb, var(--c) 16%, transparent);
    color: var(--c);
    font-size: 10.5px;
    font-weight: 700;
  }

  .pill:hover span { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }

  .pill input:checked + span {
    border-color: transparent;
    background: color-mix(in srgb, var(--c) 13%, var(--card));
    color: var(--c);
  }

  .pill input:checked + span::before { background: var(--c); color: var(--card); }

  .pill input:focus-visible + span {
    outline: 2px solid var(--c);
    outline-offset: 2px;
  }

  /* ---- Abschnitte ---- */

  .section {
    margin-bottom: 14px;
    padding: 4px 6px 6px;
    border-radius: 16px;
    background: var(--card);
    box-shadow: var(--shadow);
    transition: background 160ms;
  }

  .section.over { background: color-mix(in srgb, var(--c) 8%, var(--card)); }

  .section > header {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 10px 10px;
  }

  .badge {
    display: grid;
    place-items: center;
    width: 21px; height: 21px;
    border-radius: 7px;
    background: var(--c);
    color: var(--card);
    font-size: 11.5px;
    font-weight: 700;
  }

  .section h2 {
    margin: 0;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--c);
  }

  .aside {
    font-size: 11px;
    letter-spacing: .02em;
    color: var(--muted);
    text-transform: lowercase;
  }

  .count {
    margin-left: auto;
    min-width: 22px;
    padding: 2px 7px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--c) 12%, transparent);
    font-size: 11.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-align: center;
    color: var(--c);
  }

  .count[hidden] { display: none; }

  .empty {
    margin: 0;
    padding: 2px 10px 12px;
    font-size: 13.5px;
    color: var(--muted);
  }

  /* ---- Aufgaben ---- */

  .list { margin: 0; padding: 0; list-style: none; }

  .item {
    display: grid;
    grid-template-columns: 20px 20px 1fr 24px;
    align-items: start;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 10px;
    background: var(--card);
    transition: background 140ms;
  }

  .item:hover { background: var(--field); }

  .item.dragging {
    position: relative;
    z-index: 6;
    background: var(--card);
    box-shadow: var(--lift);
  }

  .handle {
    margin-top: 2px;
    padding: 0;
    width: 20px; height: 20px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--muted);
    cursor: grab;
    touch-action: none;
    transition: opacity 140ms;
  }

  .item.dragging .handle { cursor: grabbing; }

  @media (hover: hover) {
    .handle, .del { opacity: 0; }
    .item:hover .handle,
    .item:hover .del,
    .item:focus-within .handle,
    .item:focus-within .del { opacity: 1; }
  }

  .slot {
    margin-top: 1px;
    padding: 0;
    width: 19px; height: 19px;
    display: grid;
    place-items: center;
    border: 1.6px solid color-mix(in srgb, var(--c) 42%, transparent);
    border-radius: 7px;
    background: none;
    cursor: pointer;
    transition: background 160ms, border-color 160ms;
  }

  .slot:hover { border-color: var(--c); }

  .item.done .slot { background: var(--c); border-color: var(--c); }

  .slot .icon svg {
    stroke: var(--card);
    opacity: 0;
    transform: scale(.55);
    transition: opacity 160ms, transform 160ms;
  }

  .item.done .slot .icon svg { opacity: 1; transform: none; }

  .textcell { min-width: 0; padding-top: 1px; }

  .text {
    display: inline;
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--text);
    cursor: pointer;
    overflow-wrap: anywhere;
    background-image: linear-gradient(var(--c), var(--c));
    background-repeat: no-repeat;
    background-size: 0% 1.5px;
    background-position: 0 .62em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    transition: background-size 320ms cubic-bezier(.2,.7,.3,1), color 320ms;
  }

  .item.done .text { background-size: 100% 1.5px; color: var(--muted); }

  .edit {
    width: 100%;
    padding: 0;
    border: 0;
    border-bottom: 1.5px solid var(--c);
    background: transparent;
    font: inherit;
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--text);
    outline: none;
  }

  .del {
    margin-top: 2px;
    padding: 0;
    width: 24px; height: 20px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: color 140ms, opacity 140ms;
  }

  .del:hover { color: var(--c-vital); }

  /* ---- Notizen ---- */

  .notes {
    margin-top: 22px;
    padding: 4px 6px 10px;
    border-radius: 16px;
    background: var(--card);
    box-shadow: var(--shadow);
  }

  .notes header {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding: 12px 12px 6px;
  }

  .notes h2 {
    margin: 0;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .saved {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    opacity: 0;
    transition: opacity 400ms;
  }

  .saved.show { opacity: 1; }

  #notes {
    display: block;
    width: 100%;
    min-height: 96px;
    padding: 4px 12px 8px;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--text);
    resize: none;
    outline: none;
    overflow: hidden;
  }

  #notes::placeholder { color: var(--muted); }

  /* ---- Hinweis, Fokus, Motion ---- */

  .warn {
    margin: 14px 0 0;
    padding: 11px 13px;
    border-radius: 12px;
    background: var(--card);
    box-shadow: var(--shadow);
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
  }

  .warn a { color: var(--c-delegate); }

  :focus-visible {
    outline: 2px solid var(--c, var(--text));
    outline-offset: 2px;
  }

  .sr {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; }
  }

  @media (max-width: 460px) {
    .app { padding: 0 13px 48px; }
    .pill span { padding: 6px 10px 6px 8px; font-size: 12px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div>
        <span class="brand">To-do</span><span id="count" class="tally"></span>
      </div>
      <div class="tools">
        <button type="button" id="exportBtn" class="linkbtn">Sichern</button>
        <button type="button" id="importBtn" class="linkbtn">Laden</button>
        <button type="button" id="clearDone" class="linkbtn" hidden>Erledigte löschen</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>

    <p id="warn" class="warn" hidden>
      Dieser Browser speichert hier nichts - das passiert in eingebetteten Ansichten.
      <a id="warnLink" href="#" target="_blank" rel="noopener">In eigenem Tab öffnen</a>
    </p>

    <div class="composer">
      <input id="newTask" type="text" autocomplete="off" placeholder="Was steht an?" aria-label="Neue Aufgabe">
      <div id="picker" class="picker" role="radiogroup" aria-label="Kategorie"></div>
    </div>

    <main id="sections"></main>

    <section class="notes">
      <header>
        <h2>Notizen</h2>
        <span id="saved" class="saved">gespeichert</span>
      </header>
      <textarea id="notes" placeholder="Freier Platz. Gedanken, Nummern, alles, was in keine Aufgabe passt."></textarea>
    </section>

    <p id="live" class="sr" role="status" aria-live="polite"></p>
  </div>

<script>
(function () {
  'use strict';

  var TASK_KEY = 'notion-todo-v1';
  var NOTE_KEY = 'notion-todo-notes-v1';

  /* Die vier Kategorien. Reihenfolge hier = Reihenfolge auf dem Bildschirm. */
  var CATS = [
    { key: 'quick',    n: 1, name: 'Schnell erledigt',  short: 'Schnell',    color: 'var(--c-quick)' },
    { key: 'vital',    n: 2, name: 'Wirklich wichtig',  short: 'Wichtig',    color: 'var(--c-vital)' },
    { key: 'later',    n: 3, name: 'Kann noch warten',  short: 'Später',     color: 'var(--c-later)' },
    { key: 'delegate', n: 4, name: 'Delegier das',      short: 'Delegieren', color: 'var(--c-delegate)',
      aside: 'nicht so wichtig' }
  ];

  var sectionsEl = document.getElementById('sections');
  var pickerEl   = document.getElementById('picker');
  var newTask    = document.getElementById('newTask');
  var countEl    = document.getElementById('count');
  var clearBtn   = document.getElementById('clearDone');
  var liveEl     = document.getElementById('live');
  var warnEl     = document.getElementById('warn');
  var warnLink   = document.getElementById('warnLink');
  var exportBtn  = document.getElementById('exportBtn');
  var importBtn  = document.getElementById('importBtn');
  var importFile = document.getElementById('importFile');
  var notesEl    = document.getElementById('notes');
  var savedEl    = document.getElementById('saved');

  var ICON_DOTS  = '<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2.5" cy="4" r="1.15"/><circle cx="7.5" cy="4" r="1.15"/><circle cx="2.5" cy="8" r="1.15"/><circle cx="7.5" cy="8" r="1.15"/><circle cx="2.5" cy="12" r="1.15"/><circle cx="7.5" cy="12" r="1.15"/></svg>';
  var ICON_CHECK = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.4 4.7 9 10 3.2"/></svg>';
  var ICON_CROSS = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"/></svg>';

  var tasks = readTasks();
  var drag = null;
  var noteTimer = null;

  /* ---------- Speichern ---------- */

  function storageWorks() {
    try {
      localStorage.setItem('__probe', '1');
      localStorage.removeItem('__probe');
      return true;
    } catch (err) {
      return false;
    }
  }

  function catByKey(key) {
    for (var i = 0; i < CATS.length; i++) {
      if (CATS[i].key === key) return CATS[i];
    }
    return null;
  }

  function isTask(t) {
    return t && typeof t.id === 'string' && typeof t.text === 'string' && typeof t.done === 'boolean';
  }

  /* Bringt jede gespeicherte Aufgabe auf die aktuelle Form. Aus der früheren
     Eisenhower-Fassung übersetzt: wichtig+dringend wird "wirklich wichtig",
     der Rest verteilt sich sinngemäß. */
  function normalize(t) {
    var key = catByKey(t.cat) ? t.cat : null;

    if (!key && typeof t.important === 'boolean') {
      if (t.important) key = t.urgent ? 'vital' : 'later';
      else key = 'delegate';
    }

    return { id: t.id, text: t.text, done: t.done, cat: key || 'later' };
  }

  function readTasks() {
    try {
      var raw = localStorage.getItem(TASK_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed.filter(isTask).map(normalize) : [];
    } catch (err) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(TASK_KEY, JSON.stringify(tasks));
    } catch (err) {
      showWarning();
    }
  }

  function saveNotes() {
    try {
      localStorage.setItem(NOTE_KEY, notesEl.value);
      savedEl.classList.add('show');
      setTimeout(function () { savedEl.classList.remove('show'); }, 1400);
    } catch (err) {
      showWarning();
    }
  }

  function showWarning() {
    warnLink.href = location.href;
    warnEl.hidden = false;
  }

  function newId() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------- Gerüst ---------- */

  function buildPicker() {
    CATS.forEach(function (cat, index) {
      var label = document.createElement('label');
      label.className = 'pill';
      label.style.setProperty('--c', cat.color);

      var input = document.createElement('input');
      input.type = 'radio';
      input.name = 'cat';
      input.value = cat.key;
      input.checked = index === 0;

      var face = document.createElement('span');
      face.dataset.n = String(cat.n);
      face.appendChild(document.createTextNode(cat.short));

      input.addEventListener('change', function () {
        newTask.style.setProperty('--pick', cat.color);
      });

      label.appendChild(input);
      label.appendChild(face);
      pickerEl.appendChild(label);

      cat.inputEl = input;
    });

    newTask.style.setProperty('--pick', CATS[0].color);
  }

  function buildSections() {
    CATS.forEach(function (cat) {
      var section = document.createElement('section');
      section.className = 'section';
      section.dataset.cat = cat.key;
      section.style.setProperty('--c', cat.color);

      var head = document.createElement('header');

      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.setAttribute('aria-hidden', 'true');
      badge.textContent = String(cat.n);

      var title = document.createElement('h2');
      title.id = 'head-' + cat.key;
      title.textContent = cat.name;

      head.appendChild(badge);
      head.appendChild(title);

      if (cat.aside) {
        var aside = document.createElement('span');
        aside.className = 'aside';
        aside.textContent = cat.aside;
        head.appendChild(aside);
      }

      var count = document.createElement('span');
      count.className = 'count';
      count.hidden = true;
      head.appendChild(count);

      var list = document.createElement('ul');
      list.className = 'list';
      list.setAttribute('aria-labelledby', title.id);

      var empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = 'Noch nichts hier.';

      section.appendChild(head);
      section.appendChild(list);
      section.appendChild(empty);
      sectionsEl.appendChild(section);

      cat.el = section;
      cat.listEl = list;
      cat.countEl = count;
      cat.emptyEl = empty;
    });
  }

  /* ---------- Aufgabenzeile ---------- */

  function icon(markup) {
    var span = document.createElement('span');
    span.className = 'icon';
    span.setAttribute('aria-hidden', 'true');
    span.innerHTML = markup;
    return span;
  }

  function buildRow(task) {
    var li = document.createElement('li');
    li.className = task.done ? 'item done' : 'item';
    li.dataset.id = task.id;

    var handle = document.createElement('button');
    handle.type = 'button';
    handle.className = 'handle';
    handle.setAttribute('aria-label', 'Verschieben: ' + task.text);
    handle.title = 'Ziehen, oder mit Pfeil hoch/runter verschieben';
    handle.appendChild(icon(ICON_DOTS));
    handle.addEventListener('pointerdown', beginDrag);
    handle.addEventListener('keydown', moveByKey);

    var slot = document.createElement('button');
    slot.type = 'button';
    slot.className = 'slot';
    slot.setAttribute('role', 'checkbox');
    slot.setAttribute('aria-checked', String(task.done));
    slot.setAttribute('aria-label', task.text);
    slot.appendChild(icon(ICON_CHECK));
    slot.addEventListener('click', function () { toggle(task.id); });

    var cell = document.createElement('div');
    cell.className = 'textcell';

    var text = document.createElement('span');
    text.className = 'text';
    text.textContent = task.text;
    text.title = 'Doppelklick zum Bearbeiten';
    text.setAttribute('aria-hidden', 'true');
    cell.appendChild(text);

    // Einfacher Klick hakt ab, Doppelklick bearbeitet - kurze Wartezeit trennt beides.
    var clickTimer = null;
    text.addEventListener('click', function () {
      clearTimeout(clickTimer);
      clickTimer = setTimeout(function () { toggle(task.id); }, 190);
    });
    text.addEventListener('dblclick', function () {
      clearTimeout(clickTimer);
      startEdit(li, task);
    });

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.setAttribute('aria-label', 'Löschen: ' + task.text);
    del.appendChild(icon(ICON_CROSS));
    del.addEventListener('click', function () { remove(task.id); });

    li.appendChild(handle);
    li.appendChild(slot);
    li.appendChild(cell);
    li.appendChild(del);
    return li;
  }

  function render() {
    var rows = {};
    CATS.forEach(function (cat) { rows[cat.key] = []; });

    tasks.forEach(function (task) {
      rows[task.cat].push(buildRow(task));
    });

    CATS.forEach(function (cat) {
      cat.listEl.replaceChildren.apply(cat.listEl, rows[cat.key]);
    });

    updateMeta();
  }

  function updateMeta() {
    var open = 0, done = 0;
    var perCat = {};
    CATS.forEach(function (cat) { perCat[cat.key] = { open: 0, total: 0 }; });

    tasks.forEach(function (task) {
      if (task.done) done++; else open++;
      perCat[task.cat].total++;
      if (!task.done) perCat[task.cat].open++;
    });

    CATS.forEach(function (cat) {
      var stat = perCat[cat.key];
      cat.countEl.hidden = stat.open === 0;
      cat.countEl.textContent = String(stat.open);
      cat.emptyEl.hidden = stat.total > 0;
    });

    if (tasks.length === 0) countEl.textContent = '';
    else if (done === 0) countEl.textContent = open + ' offen';
    else countEl.textContent = open + ' offen · ' + done + ' erledigt';

    clearBtn.hidden = done === 0;
  }

  function announce(message) {
    liveEl.textContent = message;
  }

  function rowById(id) {
    return sectionsEl.querySelector('[data-id="' + id + '"]');
  }

  /* ---------- Aktionen ---------- */

  function pick(cat) {
    cat.inputEl.checked = true;
    newTask.style.setProperty('--pick', cat.color);
    announce(cat.name + ' gewählt.');
  }

  function selectedCat() {
    for (var i = 0; i < CATS.length; i++) {
      if (CATS[i].inputEl.checked) return CATS[i];
    }
    return CATS[0];
  }

  function add(value) {
    var text = value.trim();
    if (!text) return;

    var cat = selectedCat();
    tasks.push({ id: newId(), text: text, done: false, cat: cat.key });
    save();
    render();
    announce('Hinzugefügt unter ' + cat.name);
  }

  // Nur die betroffene Zeile ändern, damit der Strich sich zeichnen kann.
  function toggle(id) {
    var task = null;
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) { task = tasks[i]; break; }
    }
    if (!task) return;

    task.done = !task.done;
    save();

    var li = rowById(id);
    if (li) {
      li.classList.toggle('done', task.done);
      li.querySelector('.slot').setAttribute('aria-checked', String(task.done));
    }
    updateMeta();
  }

  function remove(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    save();
    render();
    announce('Aufgabe gelöscht.');
  }

  function startEdit(li, task) {
    var cell = li.querySelector('.textcell');
    var input = document.createElement('input');
    var finished = false;

    input.type = 'text';
    input.className = 'edit';
    input.value = task.text;
    input.setAttribute('aria-label', 'Aufgabe bearbeiten');

    function finish(keep) {
      if (finished) return;
      finished = true;
      if (keep) {
        var value = input.value.trim();
        if (value) { task.text = value; save(); }
      }
      render();
    }

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', function () { finish(true); });

    cell.replaceChildren(input);
    input.focus();
    input.select();
  }

  /* ---------- Reihenfolge und Kategorie ---------- */

  // Übernimmt die sichtbare Anordnung in die Daten: Abschnitt bestimmt die Kategorie.
  function commitOrder() {
    var byId = {};
    tasks.forEach(function (task) { byId[task.id] = task; });

    var next = [];
    CATS.forEach(function (cat) {
      Array.prototype.forEach.call(cat.listEl.children, function (li) {
        var task = byId[li.dataset.id];
        if (!task) return;
        task.cat = cat.key;
        next.push(task);
      });
    });

    tasks = next;
    save();
    updateMeta();
  }

  function catOfElement(li) {
    var section = li.closest('.section');
    for (var i = 0; i < CATS.length; i++) {
      if (CATS[i].el === section) return CATS[i];
    }
    return null;
  }

  // Zeile, vor der die gezogene landen soll - null heißt: ans Ende.
  function dropTarget(list, pointerY, dragged) {
    for (var i = 0; i < list.children.length; i++) {
      var row = list.children[i];
      if (row === dragged) continue;
      var box = row.getBoundingClientRect();
      if (pointerY < box.top + box.height / 2) return row;
    }
    return null;
  }

  function catUnder(x, y) {
    for (var i = 0; i < CATS.length; i++) {
      var box = CATS[i].el.getBoundingClientRect();
      if (x >= box.left && x <= box.right && y >= box.top && y <= box.bottom) return CATS[i];
    }
    return null;
  }

  function highlight(cat) {
    CATS.forEach(function (c) { c.el.classList.toggle('over', c === cat); });
  }

  // Misst die Ruhelage der Zeile neu und setzt sie unter den Zeiger. Dadurch
  // stimmt die Position auch nach Umhängen oder Scrollen.
  function follow(pointerY) {
    var li = drag.li;
    li.style.transform = '';
    var box = li.getBoundingClientRect();
    li.style.transform = 'translateY(' + (pointerY - drag.grabY - box.top) + 'px)';
  }

  function beginDrag(e) {
    if (e.button && e.button !== 0) return;
    e.preventDefault();

    var handle = e.currentTarget;
    var li = handle.closest('.item');
    handle.setPointerCapture(e.pointerId);

    drag = { handle: handle, li: li, grabY: e.clientY - li.getBoundingClientRect().top };
    li.classList.add('dragging');

    handle.addEventListener('pointermove', onDrag);
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
  }

  function onDrag(e) {
    if (!drag) return;

    // Seite mitziehen, wenn der Zeiger an den Fensterrand kommt.
    if (e.clientY < 70) window.scrollBy(0, -14);
    else if (e.clientY > window.innerHeight - 70) window.scrollBy(0, 14);

    var cat = catUnder(e.clientX, e.clientY) || catOfElement(drag.li);
    if (cat) {
      highlight(cat);
      var target = dropTarget(cat.listEl, e.clientY, drag.li);
      if (drag.li.parentNode !== cat.listEl || target !== drag.li.nextElementSibling) {
        cat.listEl.insertBefore(drag.li, target);
      }
    }

    follow(e.clientY);
  }

  function endDrag(e) {
    if (!drag) return;

    drag.li.style.transform = '';
    drag.li.classList.remove('dragging');
    drag.handle.removeEventListener('pointermove', onDrag);
    drag.handle.removeEventListener('pointerup', endDrag);
    drag.handle.removeEventListener('pointercancel', endDrag);
    if (drag.handle.hasPointerCapture(e.pointerId)) drag.handle.releasePointerCapture(e.pointerId);

    highlight(null);
    drag = null;
    commitOrder();
  }

  /* Tastatur: hoch/runter sortiert im Abschnitt und springt an dessen Rand
     in den nächsten - so ist jede Kategorie ohne Maus erreichbar. */
  function moveByKey(e) {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();

    var handle = e.currentTarget;
    var li = handle.closest('.item');
    var cat = catOfElement(li);
    if (!cat) return;

    var rows = Array.prototype.slice.call(cat.listEl.children);
    var index = rows.indexOf(li);
    var step = e.key === 'ArrowUp' ? -1 : 1;
    var next = index + step;

    if (next >= 0 && next < rows.length) {
      var mate = rows[next];
      cat.listEl.insertBefore(li, step < 0 ? mate : mate.nextElementSibling);
      announce('Position ' + (next + 1) + ' von ' + rows.length + ' in ' + cat.name);
    } else {
      var neighbour = CATS[CATS.indexOf(cat) + step];
      if (!neighbour) return;

      if (step > 0) neighbour.listEl.insertBefore(li, neighbour.listEl.firstChild);
      else neighbour.listEl.appendChild(li);

      announce('Verschoben nach ' + neighbour.name);
    }

    commitOrder();
    handle.focus();
    li.scrollIntoView({ block: 'nearest' });
  }

  /* ---------- Notizen ---------- */

  function growNotes() {
    notesEl.style.height = 'auto';
    notesEl.style.height = notesEl.scrollHeight + 'px';
  }

  function loadNotes() {
    try {
      notesEl.value = localStorage.getItem(NOTE_KEY) || '';
    } catch (err) {
      notesEl.value = '';
    }
    growNotes();
  }

  /* ---------- Sichern & Laden ---------- */

  function exportAll() {
    var payload = { version: 2, tasks: tasks, notes: notesEl.value };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');

    link.href = url;
    link.download = 'todo-' + new Date().toISOString().slice(0, 10) + '.json';
    link.click();

    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    announce('Liste gesichert.');
  }

  function importAll(file) {
    var reader = new FileReader();

    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        parsed = null;
      }

      // Ältere Sicherungen sind eine reine Liste, neuere ein Paket mit Notizen.
      var rawTasks = Array.isArray(parsed) ? parsed
        : (parsed && Array.isArray(parsed.tasks) ? parsed.tasks : []);
      var incoming = rawTasks.filter(isTask).map(normalize);
      var incomingNotes = parsed && typeof parsed.notes === 'string' ? parsed.notes : null;

      if (incoming.length === 0 && incomingNotes === null) {
        alert('In dieser Datei steht keine gesicherte Liste.');
        return;
      }

      if ((tasks.length > 0 || notesEl.value.trim() !== '') &&
          !confirm('Aufgaben und Notizen werden durch den Inhalt der Datei ersetzt. Fortfahren?')) {
        return;
      }

      tasks = incoming;
      save();
      render();

      if (incomingNotes !== null) {
        notesEl.value = incomingNotes;
        growNotes();
        saveNotes();
      }

      announce(incoming.length + ' Aufgaben geladen.');
    };

    reader.onerror = function () { alert('Die Datei konnte nicht gelesen werden.'); };
    reader.readAsText(file);
  }

  /* ---------- Start ---------- */

  newTask.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    add(newTask.value);
    newTask.value = '';
  });

  // Alt + 1 bis 4 wählt die Kategorie, ohne die Hand von der Tastatur zu nehmen.
  // e.code statt e.key, damit es auf jeder Tastaturbelegung dieselbe Taste ist.
  document.addEventListener('keydown', function (e) {
    if (!e.altKey && !e.metaKey && !e.ctrlKey) return;
    var index = ['Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(e.code);
    if (index === -1) return;

    e.preventDefault();
    pick(CATS[index]);
    newTask.focus();
  });

  notesEl.addEventListener('input', function () {
    growNotes();
    clearTimeout(noteTimer);
    noteTimer = setTimeout(saveNotes, 500);
  });

  exportBtn.addEventListener('click', exportAll);

  importBtn.addEventListener('click', function () { importFile.click(); });

  importFile.addEventListener('change', function () {
    var file = importFile.files && importFile.files[0];
    if (file) importAll(file);
    importFile.value = '';
  });

  clearBtn.addEventListener('click', function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save();
    render();
    announce('Erledigte Aufgaben entfernt.');
  });

  window.addEventListener('resize', growNotes);

  if (!storageWorks()) showWarning();
  buildPicker();
  buildSections();
  render();
  loadNotes();

  // Im eigenen App-Fenster gleich tippbereit sein.
  if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
    newTask.focus();
  }

  // Macht die App offline lauffähig. Über file:// gibt es das nicht.
  var secure = location.protocol === 'https:' || location.hostname === 'localhost';
  if ('serviceWorker' in navigator && secure) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
