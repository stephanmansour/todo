<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>To-do</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-do">
<style>
  /* Raster: 4px-Grundeinheit, eine Randspalte (--rail), in der alle Marken
     bündig rechts stehen. Farbe markiert nur, sie füllt nichts. */

  :root {
    --paper:  #F4F2ED;
    --ink:    #1A1917;
    --soft:   #6F6B63;
    --rule:   #DAD5CB;
    --tint:   rgba(26,25,23,.045);
    --lift:   0 10px 30px rgba(26,25,23,.18);

    --c1: #1F6B4A;
    --c2: #B32A20;
    --c3: #9A6B15;
    --c4: #5C5C5C;

    --rail: 48px;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141312;
      --ink:   #E8E4DC;
      --soft:  #8F8A81;
      --rule:  #2E2B27;
      --tint:  rgba(232,228,220,.055);
      --lift:  0 10px 34px rgba(0,0,0,.65);

      --c1: #5FBF8C;
      --c2: #E8695C;
      --c3: #D2A03C;
      --c4: #9A9A9A;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  body.dragging { user-select: none; cursor: grabbing; }

  .sheet {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }

  /* ---- Kopf ---- */

  .masthead {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 4px 16px;
    padding: 32px 0 10px;
  }

  .wordmark {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.01em;
  }

  .stat {
    margin-left: 10px;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--soft);
  }

  .tools { display: flex; gap: 18px; }

  .linkbtn {
    padding: 0;
    border: 0;
    background: none;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--soft);
    cursor: pointer;
    transition: color 120ms;
  }

  .linkbtn:hover, .linkbtn:focus-visible { color: var(--ink); }

  /* ---- Eingabe ---- */

  .composer {
    position: sticky;
    top: 0;
    z-index: 20;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
  }

  .field {
    display: grid;
    grid-template-columns: var(--rail) 1fr;
    align-items: baseline;
    gap: 0 10px;
    padding: 14px 0 10px;
  }

  .field .mark {
    font-size: 15px;
    text-align: right;
    color: var(--soft);
  }

  #newTask {
    padding: 0;
    border: 0;
    background: none;
    font-family: inherit;
    font-size: 17px;
    line-height: 1.4;
    color: var(--ink);
    outline: none;
  }

  #newTask::placeholder { color: var(--soft); }

  .choices {
    display: grid;
    grid-template-columns: var(--rail) 1fr;
    align-items: baseline;
    gap: 0 10px;
  }

  .choices .mark {
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    text-align: right;
    color: var(--soft);
  }

  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 18px;
  }

  .opt { cursor: pointer; }

  .opt input {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .opt span {
    display: inline-block;
    padding: 3px 0;
    border-bottom: 2px solid transparent;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--soft);
    white-space: nowrap;
    transition: color 120ms, border-color 120ms;
  }

  .opt:hover span { color: var(--ink); }

  .opt input:checked + span {
    border-bottom-color: var(--c);
    color: var(--c);
  }

  .opt input:focus-visible + span { outline: 2px solid var(--c); outline-offset: 3px; }

  .days { margin-top: 6px; }
  .days[hidden] { display: none; }

  /* ---- Abschnitt ---- */

  .section { padding-top: 30px; }

  .section > header {
    display: grid;
    grid-template-columns: var(--rail) 1fr auto;
    align-items: baseline;
    gap: 0 10px;
    padding-bottom: 7px;
    border-bottom: 1.5px solid var(--c);
  }

  .numeral {
    font-size: 25px;
    font-weight: 300;
    line-height: 1;
    text-align: right;
    color: var(--c);
    font-variant-numeric: lining-nums;
  }

  .section h2 {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .section h2 .qualifier {
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    color: var(--soft);
  }

  .total {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--soft);
  }

  .total[hidden] { display: none; }

  /* ---- Wochentage in Abschnitt 3 ---- */

  .day > header {
    display: grid;
    grid-template-columns: var(--rail) 1fr auto;
    align-items: center;
    gap: 0 10px;
    padding-top: 14px;
  }

  .day .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    text-align: right;
    color: var(--soft);
  }

  .day .hair { border-top: 1px solid var(--rule); }

  .day .count {
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    color: var(--soft);
  }

  .day .count[hidden] { display: none; }

  /* ---- Aufgaben ---- */

  .list {
    min-height: 26px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .dropping .list { background: var(--tint); }

  .item {
    display: grid;
    grid-template-columns: var(--rail) 1fr 22px;
    align-items: start;
    gap: 0 10px;
    padding: 6px 0;
    border-radius: 2px;
    transition: background 120ms;
  }

  .item:hover { background: var(--tint); }

  .item.lifted {
    background: var(--paper);
    box-shadow: var(--lift);
  }

  .rail {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 22px;
  }

  .handle {
    padding: 0;
    width: 14px; height: 18px;
    display: grid;
    place-items: center;
    border: 0;
    background: none;
    color: var(--soft);
    cursor: grab;
    touch-action: none;
    opacity: 0;
    transition: opacity 120ms;
  }

  .slot {
    padding: 0;
    width: 17px; height: 17px;
    display: grid;
    place-items: center;
    border: 1.5px solid var(--soft);
    border-radius: 2px;
    background: none;
    cursor: pointer;
    transition: background 140ms, border-color 140ms;
  }

  .slot:hover { border-color: var(--c); }

  .item.done .slot { background: var(--c); border-color: var(--c); }

  .slot .icon svg {
    stroke: var(--paper);
    opacity: 0;
    transition: opacity 140ms;
  }

  .item.done .slot .icon svg { opacity: 1; }

  .del {
    padding: 0;
    width: 22px; height: 22px;
    display: grid;
    place-items: center;
    border: 0;
    background: none;
    color: var(--soft);
    cursor: pointer;
    opacity: 0;
    transition: opacity 120ms, color 120ms;
  }

  .del:hover { color: var(--c2); }

  @media (hover: hover) {
    .item:hover .handle,
    .item:hover .del,
    .item:focus-within .handle,
    .item:focus-within .del { opacity: 1; }
  }

  @media (hover: none) {
    .handle, .del { opacity: .55; }
  }

  .textcell { min-width: 0; }

  .text {
    display: inline;
    font-size: 15px;
    line-height: 1.47;
    color: var(--ink);
    cursor: pointer;
    overflow-wrap: anywhere;
    background-image: linear-gradient(var(--c), var(--c));
    background-repeat: no-repeat;
    background-size: 0% 1.5px;
    background-position: 0 .64em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    transition: background-size 300ms cubic-bezier(.2,.7,.3,1), color 300ms;
  }

  .item.done .text { background-size: 100% 1.5px; color: var(--soft); }

  .edit {
    width: 100%;
    padding: 0;
    border: 0;
    border-bottom: 1.5px solid var(--c);
    background: none;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.47;
    color: var(--ink);
    outline: none;
  }

  /* Platzhalter, der die Lücke hält, während eine Zeile gezogen wird. */
  .ghost {
    border-radius: 2px;
    background: var(--tint);
    box-shadow: inset 0 0 0 1px var(--rule);
  }

  /* ---- Notizen ---- */

  .notes { padding-top: 34px; }

  .notes > header {
    display: grid;
    grid-template-columns: var(--rail) 1fr auto;
    align-items: baseline;
    gap: 0 10px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--rule);
  }

  .notes h2 {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--soft);
  }

  .keeping {
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--soft);
    opacity: 0;
    transition: opacity 500ms;
  }

  .keeping.show { opacity: 1; }

  #notes {
    display: block;
    width: 100%;
    min-height: 88px;
    margin-top: 12px;
    padding: 0 0 0 calc(var(--rail) + 10px);
    border: 0;
    background: none;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    resize: none;
    outline: none;
    overflow: hidden;
  }

  #notes::placeholder { color: var(--soft); }

  /* ---- Hinweis, Fokus, Bewegung ---- */

  .warn {
    margin: 16px 0 0;
    padding: 10px 0 10px calc(var(--rail) + 10px);
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    font-size: 13px;
    color: var(--soft);
  }

  .warn a { color: var(--ink); }

  :focus-visible { outline: 2px solid var(--c, var(--ink)); outline-offset: 2px; }

  .sr {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; }
  }

  @media (max-width: 480px) {
    :root { --rail: 40px; }
    .sheet { padding: 0 16px 48px; }
    .options { gap: 4px 14px; }
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="masthead">
      <div><span class="wordmark">To-do</span><span id="stat" class="stat"></span></div>
      <div class="tools">
        <button type="button" id="exportBtn" class="linkbtn">Sichern</button>
        <button type="button" id="importBtn" class="linkbtn">Laden</button>
        <button type="button" id="clearDone" class="linkbtn" hidden>Erledigte löschen</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>

    <p id="warn" class="warn" hidden>
      Dieser Browser speichert hier nichts - das passiert in eingebetteten Ansichten.
      <a id="warnLink" href="#" target="_blank" rel="noopener">In eigenem Tab öffnen</a>
    </p>

    <div class="composer">
      <div class="field">
        <span class="mark" aria-hidden="true">+</span>
        <input id="newTask" type="text" autocomplete="off" placeholder="Was steht an?" aria-label="Neue Aufgabe">
      </div>
      <div class="choices">
        <span class="mark" aria-hidden="true">In</span>
        <div id="catOptions" class="options" role="radiogroup" aria-label="Kategorie"></div>
      </div>
      <div id="dayRow" class="choices days" hidden>
        <span class="mark" aria-hidden="true">Am</span>
        <div id="dayOptions" class="options" role="radiogroup" aria-label="Wochentag"></div>
      </div>
    </div>

    <main id="sections"></main>

    <section class="notes">
      <header>
        <span aria-hidden="true"></span>
        <h2>Notizen</h2>
        <span id="keeping" class="keeping">gespeichert</span>
      </header>
      <textarea id="notes" placeholder="Freier Platz für alles, was in keine Aufgabe passt."></textarea>
    </section>

    <p id="live" class="sr" role="status" aria-live="polite"></p>
  </div>

<script>
(function () {
  'use strict';

  var TASK_KEY = 'notion-todo-v1';
  var NOTE_KEY = 'notion-todo-notes-v1';

  var CATS = [
    { key: 'quick',    n: 1, name: 'Schnell erledigt', qualifier: 'bitte jetzt', pick: 'Jetzt',       color: 'var(--c1)' },
    { key: 'vital',    n: 2, name: 'Wirklich wichtig', qualifier: '',            pick: 'Wichtig',     color: 'var(--c2)' },
    { key: 'later',    n: 3, name: 'Kann noch warten', qualifier: '',            pick: 'Später',      color: 'var(--c3)' },
    { key: 'delegate', n: 4, name: 'Delegier das',     qualifier: 'nicht so wichtig',
      pick: 'Delegieren', color: 'var(--c4)' }
  ];

  var DAYS = [
    { key: 'mo', name: 'Montag',     pick: 'Mo' },
    { key: 'di', name: 'Dienstag',   pick: 'Di' },
    { key: 'mi', name: 'Mittwoch',   pick: 'Mi' },
    { key: 'do', name: 'Donnerstag', pick: 'Do' },
    { key: 'fr', name: 'Freitag',    pick: 'Fr' }
  ];

  // Ablagefächer in Bildschirmreihenfolge: 1, 2, dann Mo bis Fr, dann 4.
  var BINS = [];

  var sectionsEl = document.getElementById('sections');
  var catOptions = document.getElementById('catOptions');
  var dayOptions = document.getElementById('dayOptions');
  var dayRow     = document.getElementById('dayRow');
  var newTask    = document.getElementById('newTask');
  var statEl     = document.getElementById('stat');
  var clearBtn   = document.getElementById('clearDone');
  var liveEl     = document.getElementById('live');
  var warnEl     = document.getElementById('warn');
  var warnLink   = document.getElementById('warnLink');
  var exportBtn  = document.getElementById('exportBtn');
  var importBtn  = document.getElementById('importBtn');
  var importFile = document.getElementById('importFile');
  var notesEl    = document.getElementById('notes');
  var keepingEl  = document.getElementById('keeping');

  var ICON_GRIP  = '<svg width="8" height="14" viewBox="0 0 8 14" fill="currentColor"><circle cx="1.6" cy="3" r="1.05"/><circle cx="6.4" cy="3" r="1.05"/><circle cx="1.6" cy="7" r="1.05"/><circle cx="6.4" cy="7" r="1.05"/><circle cx="1.6" cy="11" r="1.05"/><circle cx="6.4" cy="11" r="1.05"/></svg>';
  var ICON_CHECK = '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.4 4.7 9 10 3.2"/></svg>';
  var ICON_CROSS = '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"/></svg>';

  var MOTION_OK = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var tasks = readTasks();
  var drag = null;
  var noteTimer = null;

  /* ---------- Daten ---------- */

  function byKey(list, key) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].key === key) return list[i];
    }
    return null;
  }

  function isTask(t) {
    return t && typeof t.id === 'string' && typeof t.text === 'string' && typeof t.done === 'boolean';
  }

  /* Bringt gespeicherte Aufgaben auf die aktuelle Form. Aus der Eisenhower-
     Fassung übersetzt: wichtig+dringend wird 2, wichtig allein wird 3,
     der Rest wird 4. Wer in 3 landet und keinen Tag hat, bekommt Montag. */
  function normalize(t) {
    var cat = byKey(CATS, t.cat) ? t.cat : null;

    if (!cat && typeof t.important === 'boolean') {
      if (t.important) cat = t.urgent ? 'vital' : 'later';
      else cat = 'delegate';
    }

    cat = cat || 'later';

    return {
      id: t.id,
      text: t.text,
      done: t.done,
      cat: cat,
      day: cat === 'later' ? (byKey(DAYS, t.day) ? t.day : 'mo') : null
    };
  }

  function readTasks() {
    try {
      var raw = localStorage.getItem(TASK_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed.filter(isTask).map(normalize) : [];
    } catch (err) {
      return [];
    }
  }

  function storageWorks() {
    try {
      localStorage.setItem('__probe', '1');
      localStorage.removeItem('__probe');
      return true;
    } catch (err) {
      return false;
    }
  }

  function save() {
    try {
      localStorage.setItem(TASK_KEY, JSON.stringify(tasks));
    } catch (err) {
      showWarning();
    }
  }

  function saveNotes() {
    try {
      localStorage.setItem(NOTE_KEY, notesEl.value);
      keepingEl.classList.add('show');
      setTimeout(function () { keepingEl.classList.remove('show'); }, 1500);
    } catch (err) {
      showWarning();
    }
  }

  function showWarning() {
    warnLink.href = location.href;
    warnEl.hidden = false;
  }

  function newId() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------- Gerüst ---------- */

  function icon(markup) {
    var span = document.createElement('span');
    span.className = 'icon';
    span.setAttribute('aria-hidden', 'true');
    span.innerHTML = markup;
    return span;
  }

  function option(group, entry, checked, onPick) {
    var label = document.createElement('label');
    label.className = 'opt';

    var input = document.createElement('input');
    input.type = 'radio';
    input.name = group;
    input.value = entry.key;
    input.checked = checked;

    var face = document.createElement('span');
    face.textContent = entry.pick;

    input.addEventListener('change', function () { onPick(entry); });

    label.appendChild(input);
    label.appendChild(face);

    entry.inputEl = input;
    return label;
  }

  function buildChoices() {
    CATS.forEach(function (cat, index) {
      var label = option('cat', cat, index === 0, pickCat);
      label.style.setProperty('--c', cat.color);
      catOptions.appendChild(label);
    });

    DAYS.forEach(function (day) {
      var label = option('day', day, day.key === todayKey(), pickDay);
      label.style.setProperty('--c', 'var(--c3)');
      dayOptions.appendChild(label);
    });
  }

  // Am Wochenende ist Montag der nächste sinnvolle Vorschlag.
  function todayKey() {
    var index = new Date().getDay() - 1;
    return index >= 0 && index <= 4 ? DAYS[index].key : 'mo';
  }

  function buildSections() {
    CATS.forEach(function (cat) {
      var section = document.createElement('section');
      section.className = 'section';
      section.style.setProperty('--c', cat.color);

      var head = document.createElement('header');

      var numeral = document.createElement('span');
      numeral.className = 'numeral';
      numeral.setAttribute('aria-hidden', 'true');
      numeral.textContent = String(cat.n);

      var title = document.createElement('h2');
      title.id = 'head-' + cat.key;
      title.textContent = cat.name;

      if (cat.qualifier) {
        var qualifier = document.createElement('span');
        qualifier.className = 'qualifier';
        qualifier.textContent = ', ' + cat.qualifier;
        title.appendChild(qualifier);
      }

      var total = document.createElement('span');
      total.className = 'total';
      total.hidden = true;

      head.appendChild(numeral);
      head.appendChild(title);
      head.appendChild(total);
      section.appendChild(head);

      if (cat.key === 'later') {
        DAYS.forEach(function (day) { section.appendChild(buildDay(cat, day)); });
      } else {
        section.appendChild(makeList(cat, null, section, title.id));
      }

      sectionsEl.appendChild(section);
      cat.totalEl = total;
    });
  }

  function buildDay(cat, day) {
    var wrap = document.createElement('div');
    wrap.className = 'day';

    var head = document.createElement('header');

    var label = document.createElement('span');
    label.className = 'label';
    label.id = 'day-' + day.key;
    label.textContent = day.pick;

    var hair = document.createElement('span');
    hair.className = 'hair';

    var count = document.createElement('span');
    count.className = 'count';
    count.hidden = true;

    head.appendChild(label);
    head.appendChild(hair);
    head.appendChild(count);
    wrap.appendChild(head);
    wrap.appendChild(makeList(cat, day, wrap, label.id));

    day.countEl = count;
    return wrap;
  }

  /* Der Ablagebereich ist das ganze Element - so bleibt zwischen Überschrift
     und erster Zeile keine tote Zone, in der das Ziehen ins Leere greift. */
  function makeList(cat, day, zoneEl, labelledBy) {
    var list = document.createElement('ul');
    list.className = 'list';
    list.setAttribute('aria-labelledby', labelledBy);

    BINS.push({ cat: cat, day: day, zoneEl: zoneEl, listEl: list });
    return list;
  }

  function binOfList(list) {
    for (var i = 0; i < BINS.length; i++) {
      if (BINS[i].listEl === list) return BINS[i];
    }
    return null;
  }

  /* ---------- Zeile ---------- */

  function buildRow(task) {
    var li = document.createElement('li');
    li.className = task.done ? 'item done' : 'item';
    li.dataset.id = task.id;

    var rail = document.createElement('div');
    rail.className = 'rail';

    var handle = document.createElement('button');
    handle.type = 'button';
    handle.className = 'handle';
    handle.setAttribute('aria-label', 'Verschieben: ' + task.text);
    handle.title = 'Ziehen, oder mit Pfeil hoch/runter verschieben';
    handle.appendChild(icon(ICON_GRIP));
    handle.addEventListener('pointerdown', beginDrag);
    handle.addEventListener('keydown', moveByKey);

    var slot = document.createElement('button');
    slot.type = 'button';
    slot.className = 'slot';
    slot.setAttribute('role', 'checkbox');
    slot.setAttribute('aria-checked', String(task.done));
    slot.setAttribute('aria-label', task.text);
    slot.appendChild(icon(ICON_CHECK));
    slot.addEventListener('click', function () { toggle(task.id); });

    rail.appendChild(handle);
    rail.appendChild(slot);

    var cell = document.createElement('div');
    cell.className = 'textcell';

    var text = document.createElement('span');
    text.className = 'text';
    text.textContent = task.text;
    text.title = 'Doppelklick zum Bearbeiten';
    text.setAttribute('aria-hidden', 'true');
    cell.appendChild(text);

    // Einfacher Klick hakt ab, Doppelklick bearbeitet - kurze Wartezeit trennt beides.
    var clickTimer = null;
    text.addEventListener('click', function () {
      clearTimeout(clickTimer);
      clickTimer = setTimeout(function () { toggle(task.id); }, 190);
    });
    text.addEventListener('dblclick', function () {
      clearTimeout(clickTimer);
      startEdit(li, task);
    });

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.setAttribute('aria-label', 'Löschen: ' + task.text);
    del.appendChild(icon(ICON_CROSS));
    del.addEventListener('click', function () { remove(task.id); });

    li.appendChild(rail);
    li.appendChild(cell);
    li.appendChild(del);
    return li;
  }

  function binFor(task) {
    for (var i = 0; i < BINS.length; i++) {
      var bin = BINS[i];
      if (bin.cat.key !== task.cat) continue;
      if (bin.day && bin.day.key !== task.day) continue;
      return bin;
    }
    return BINS[0];
  }

  function render() {
    var buckets = BINS.map(function () { return []; });

    tasks.forEach(function (task) {
      buckets[BINS.indexOf(binFor(task))].push(buildRow(task));
    });

    BINS.forEach(function (bin, index) {
      bin.listEl.replaceChildren.apply(bin.listEl, buckets[index]);
    });

    updateMeta();
  }

  function updateMeta() {
    var open = 0, done = 0;
    var perCat = {}, perDay = {};

    CATS.forEach(function (cat) { perCat[cat.key] = 0; });
    DAYS.forEach(function (day) { perDay[day.key] = 0; });

    tasks.forEach(function (task) {
      if (task.done) { done++; return; }
      open++;
      perCat[task.cat]++;
      if (task.day) perDay[task.day]++;
    });

    CATS.forEach(function (cat) {
      cat.totalEl.hidden = perCat[cat.key] === 0;
      cat.totalEl.textContent = String(perCat[cat.key]);
    });

    DAYS.forEach(function (day) {
      day.countEl.hidden = perDay[day.key] === 0;
      day.countEl.textContent = String(perDay[day.key]);
    });

    if (tasks.length === 0) statEl.textContent = '';
    else if (done === 0) statEl.textContent = open + ' offen';
    else statEl.textContent = open + ' offen · ' + done + ' erledigt';

    clearBtn.hidden = done === 0;
  }

  function announce(message) { liveEl.textContent = message; }

  function taskById(id) {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].id === id) return tasks[i];
    }
    return null;
  }

  /* ---------- Aktionen ---------- */

  function pickCat(cat) {
    dayRow.hidden = cat.key !== 'later';
    announce(cat.name + ' gewählt.');
  }

  function pickDay(day) { announce(day.name + ' gewählt.'); }

  function selected(list) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].inputEl.checked) return list[i];
    }
    return list[0];
  }

  function add(value) {
    var text = value.trim();
    if (!text) return;

    var cat = selected(CATS);
    var day = cat.key === 'later' ? selected(DAYS) : null;

    tasks.push({
      id: newId(),
      text: text,
      done: false,
      cat: cat.key,
      day: day ? day.key : null
    });

    save();
    render();
    announce('Hinzugefügt: ' + cat.name + (day ? ', ' + day.name : ''));
  }

  // Nur die betroffene Zeile ändern, damit der Strich sich zeichnen kann.
  function toggle(id) {
    var task = taskById(id);
    if (!task) return;

    task.done = !task.done;
    save();

    var li = sectionsEl.querySelector('[data-id="' + id + '"]');
    if (li) {
      li.classList.toggle('done', task.done);
      li.querySelector('.slot').setAttribute('aria-checked', String(task.done));
    }
    updateMeta();
  }

  function remove(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    save();
    render();
    announce('Aufgabe gelöscht.');
  }

  function startEdit(li, task) {
    var cell = li.querySelector('.textcell');
    var input = document.createElement('input');
    var finished = false;

    input.type = 'text';
    input.className = 'edit';
    input.value = task.text;
    input.setAttribute('aria-label', 'Aufgabe bearbeiten');

    function finish(keep) {
      if (finished) return;
      finished = true;
      if (keep) {
        var value = input.value.trim();
        if (value) { task.text = value; save(); }
      }
      render();
    }

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', function () { finish(true); });

    cell.replaceChildren(input);
    input.focus();
    input.select();
  }

  // Übernimmt die sichtbare Anordnung: Fach bestimmt Kategorie und Tag.
  function commitOrder() {
    var index = {};
    tasks.forEach(function (task) { index[task.id] = task; });

    var next = [];
    BINS.forEach(function (bin) {
      Array.prototype.forEach.call(bin.listEl.children, function (node) {
        var task = index[node.dataset.id];
        if (!task) return;
        task.cat = bin.cat.key;
        task.day = bin.day ? bin.day.key : null;
        next.push(task);
      });
    });

    tasks = next;
    save();
    updateMeta();
  }

  /* ---------- Ziehen ----------
     Die gezogene Zeile wird aus dem Textfluss genommen (position: fixed) und
     ein Platzhalter hält ihre Lücke. Dadurch verschiebt sich beim Ziehen nichts
     mehr unter dem Zeiger, und das Verhaken zwischen zwei Zeilen entfällt. */

  function rowsInPlay() {
    return Array.prototype.slice.call(sectionsEl.querySelectorAll('.item'));
  }

  // Bewegt den Platzhalter und lässt die verdrängten Zeilen weich nachrücken.
  function placeGhost(list, before) {
    if (drag.ghost.parentNode === list && drag.ghost.nextElementSibling === before) return;

    var rows = MOTION_OK ? rowsInPlay() : [];

    // Erst die sichtbare Lage merken, dann laufende Bewegungen abräumen -
    // sonst fließen sie in die nächste Messung ein und die Zeilen driften.
    var from = rows.map(function (row) { return row.getBoundingClientRect().top; });

    rows.forEach(function (row) {
      row.style.transition = 'none';
      row.style.transform = '';
    });

    list.insertBefore(drag.ghost, before);

    var to = rows.map(function (row) { return row.getBoundingClientRect().top; });

    rows.forEach(function (row, i) {
      if (from[i] === to[i]) return;
      row.style.transform = 'translateY(' + (from[i] - to[i]) + 'px)';

      requestAnimationFrame(function () {
        row.style.transition = 'transform 170ms cubic-bezier(.2,.7,.3,1)';
        row.style.transform = '';
      });
    });
  }

  function clearShifts() {
    rowsInPlay().forEach(function (row) {
      row.style.transition = '';
      row.style.transform = '';
    });
  }

  // Das Fach unter dem Zeiger - oder, wenn keins passt, das nächstgelegene.
  function binAt(y) {
    var nearest = null, gap = Infinity;

    for (var i = 0; i < BINS.length; i++) {
      var box = BINS[i].zoneEl.getBoundingClientRect();
      if (y >= box.top && y <= box.bottom) return BINS[i];

      var distance = y < box.top ? box.top - y : y - box.bottom;
      if (distance < gap) { gap = distance; nearest = BINS[i]; }
    }

    return nearest;
  }

  function referenceRow(list, y) {
    for (var i = 0; i < list.children.length; i++) {
      var row = list.children[i];
      if (row === drag.ghost) continue;
      var box = row.getBoundingClientRect();
      if (y < box.top + box.height / 2) return row;
    }
    return null;
  }

  function updateTarget() {
    var bin = binAt(drag.y);
    if (!bin) return;

    if (drag.bin !== bin) {
      if (drag.bin) drag.bin.zoneEl.classList.remove('dropping');
      bin.zoneEl.classList.add('dropping');
      drag.li.style.setProperty('--c', bin.cat.color);
      drag.bin = bin;
    }

    placeGhost(bin.listEl, referenceRow(bin.listEl, drag.y));
  }

  function autoScroll() {
    if (!drag) return;

    var edge = 80;
    var speed = 0;

    if (drag.y < edge) speed = -Math.ceil((edge - drag.y) / 6);
    else if (drag.y > window.innerHeight - edge) speed = Math.ceil((drag.y - (window.innerHeight - edge)) / 6);

    if (speed) {
      window.scrollBy(0, speed);
      updateTarget();
    }

    drag.raf = requestAnimationFrame(autoScroll);
  }

  function beginDrag(e) {
    if (e.button && e.button !== 0) return;
    if (drag) return;
    e.preventDefault();

    var handle = e.currentTarget;
    var li = handle.closest('.item');
    var box = li.getBoundingClientRect();
    var origin = binOfList(li.parentNode);

    var ghost = document.createElement('li');
    ghost.className = 'ghost';
    ghost.style.height = box.height + 'px';

    drag = {
      handle: handle,
      li: li,
      ghost: ghost,
      bin: null,
      originX: e.clientX,
      originY: e.clientY,
      x: e.clientX,
      y: e.clientY,
      raf: 0,
      landing: false
    };

    li.parentNode.insertBefore(ghost, li);

    li.style.setProperty('--c', origin ? origin.cat.color : CATS[0].color);
    li.style.position = 'fixed';
    li.style.left = box.left + 'px';
    li.style.top = box.top + 'px';
    li.style.width = box.width + 'px';
    li.style.margin = '0';
    li.style.pointerEvents = 'none';
    li.style.zIndex = '60';
    li.classList.add('lifted');
    document.body.appendChild(li);
    document.body.classList.add('dragging');

    handle.setPointerCapture(e.pointerId);
    handle.addEventListener('pointermove', onDrag);
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);

    updateTarget();
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function onDrag(e) {
    if (!drag || drag.landing) return;

    drag.x = e.clientX;
    drag.y = e.clientY;
    drag.li.style.transform =
      'translate(' + (drag.x - drag.originX) + 'px,' + (drag.y - drag.originY) + 'px)';

    updateTarget();
  }

  function endDrag(e) {
    if (!drag || drag.landing) return;

    drag.landing = true;
    cancelAnimationFrame(drag.raf);

    drag.handle.removeEventListener('pointermove', onDrag);
    drag.handle.removeEventListener('pointerup', endDrag);
    drag.handle.removeEventListener('pointercancel', endDrag);
    if (drag.handle.hasPointerCapture(e.pointerId)) drag.handle.releasePointerCapture(e.pointerId);

    var target = drag.ghost.getBoundingClientRect();
    var current = drag.li.getBoundingClientRect();

    if (!MOTION_OK || (Math.abs(target.top - current.top) < 1 && Math.abs(target.left - current.left) < 1)) {
      settle();
      return;
    }

    // Zum Schluss rutscht die Zeile sichtbar in ihre Lücke.
    drag.li.style.transition = 'transform 160ms cubic-bezier(.2,.7,.3,1)';
    drag.li.style.transform =
      'translate(' + (target.left - current.left + (drag.x - drag.originX)) + 'px,' +
                     (target.top - current.top + (drag.y - drag.originY)) + 'px)';

    setTimeout(settle, 170);
  }

  function settle() {
    if (!drag) return;

    var li = drag.li;
    var ghost = drag.ghost;

    li.removeAttribute('style');
    li.classList.remove('lifted');
    ghost.parentNode.insertBefore(li, ghost);
    ghost.remove();

    if (drag.bin) drag.bin.zoneEl.classList.remove('dropping');
    document.body.classList.remove('dragging');

    var landedIn = drag.bin;
    drag = null;

    clearShifts();
    commitOrder();

    if (landedIn) {
      announce(landedIn.cat.name + (landedIn.day ? ', ' + landedIn.day.name : ''));
    }
  }

  /* Tastatur: hoch/runter sortiert im Fach und springt an dessen Rand ins
     nächste - damit ist jede Kategorie und jeder Tag ohne Maus erreichbar. */
  function moveByKey(e) {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();

    var handle = e.currentTarget;
    var li = handle.closest('.item');
    var list = li.parentNode;
    var bin = binOfList(list);
    if (!bin) return;

    var rows = Array.prototype.slice.call(list.children);
    var index = rows.indexOf(li);
    var step = e.key === 'ArrowUp' ? -1 : 1;
    var next = index + step;

    if (next >= 0 && next < rows.length) {
      var mate = rows[next];
      list.insertBefore(li, step < 0 ? mate : mate.nextElementSibling);
      announce('Position ' + (next + 1) + ' von ' + rows.length);
    } else {
      var neighbour = BINS[BINS.indexOf(bin) + step];
      if (!neighbour) return;

      if (step > 0) neighbour.listEl.insertBefore(li, neighbour.listEl.firstChild);
      else neighbour.listEl.appendChild(li);

      announce(neighbour.cat.name + (neighbour.day ? ', ' + neighbour.day.name : ''));
    }

    commitOrder();
    handle.focus();
    li.scrollIntoView({ block: 'nearest' });
  }

  /* ---------- Notizen ---------- */

  function growNotes() {
    notesEl.style.height = 'auto';
    notesEl.style.height = notesEl.scrollHeight + 'px';
  }

  function loadNotes() {
    try {
      notesEl.value = localStorage.getItem(NOTE_KEY) || '';
    } catch (err) {
      notesEl.value = '';
    }
    growNotes();
  }

  /* ---------- Sichern & Laden ---------- */

  function exportAll() {
    var payload = { version: 3, tasks: tasks, notes: notesEl.value };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');

    link.href = url;
    link.download = 'todo-' + new Date().toISOString().slice(0, 10) + '.json';
    link.click();

    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    announce('Liste gesichert.');
  }

  function importAll(file) {
    var reader = new FileReader();

    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        parsed = null;
      }

      // Ältere Sicherungen sind eine reine Liste, neuere ein Paket mit Notizen.
      var rawTasks = Array.isArray(parsed) ? parsed
        : (parsed && Array.isArray(parsed.tasks) ? parsed.tasks : []);
      var incoming = rawTasks.filter(isTask).map(normalize);
      var incomingNotes = parsed && typeof parsed.notes === 'string' ? parsed.notes : null;

      if (incoming.length === 0 && incomingNotes === null) {
        alert('In dieser Datei steht keine gesicherte Liste.');
        return;
      }

      if ((tasks.length > 0 || notesEl.value.trim() !== '') &&
          !confirm('Aufgaben und Notizen werden durch den Inhalt der Datei ersetzt. Fortfahren?')) {
        return;
      }

      tasks = incoming;
      save();
      render();

      if (incomingNotes !== null) {
        notesEl.value = incomingNotes;
        growNotes();
        saveNotes();
      }

      announce(incoming.length + ' Aufgaben geladen.');
    };

    reader.onerror = function () { alert('Die Datei konnte nicht gelesen werden.'); };
    reader.readAsText(file);
  }

  /* ---------- Start ---------- */

  newTask.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    add(newTask.value);
    newTask.value = '';
  });

  // Alt + 1 bis 4 wählt die Kategorie. e.code, damit die Belegung egal ist.
  document.addEventListener('keydown', function (e) {
    if (!e.altKey && !e.metaKey && !e.ctrlKey) return;
    var index = ['Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(e.code);
    if (index === -1) return;

    e.preventDefault();
    CATS[index].inputEl.checked = true;
    pickCat(CATS[index]);
    newTask.focus();
  });

  notesEl.addEventListener('input', function () {
    growNotes();
    clearTimeout(noteTimer);
    noteTimer = setTimeout(saveNotes, 500);
  });

  exportBtn.addEventListener('click', exportAll);
  importBtn.addEventListener('click', function () { importFile.click(); });

  importFile.addEventListener('change', function () {
    var file = importFile.files && importFile.files[0];
    if (file) importAll(file);
    importFile.value = '';
  });

  clearBtn.addEventListener('click', function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save();
    render();
    announce('Erledigte Aufgaben entfernt.');
  });

  window.addEventListener('resize', growNotes);

  if (!storageWorks()) showWarning();
  buildChoices();
  buildSections();
  render();
  loadNotes();

  if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
    newTask.focus();
  }

  var secure = location.protocol === 'https:' || location.hostname === 'localhost';
  if ('serviceWorker' in navigator && secure) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
